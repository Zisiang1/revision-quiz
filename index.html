:false},{"id":54,"topic":"Project Management and Estimation","bonus":false,"q":"A Function Point assessment has a Degree of Influence of 35. What is its Technical Complexity Factor?","options":[{"letter":"A","text":"0.95"},{"letter":"B","text":"1.02"},{"letter":"C","text":"1.35"},{"letter":"D","text":"1.00"}],"answer":"D","rationale":"FP TCF is `0.65 + 0.01×35 = 1.00`. Tags: W5, Function Points, application.","source":"brief 9.4","flag":false},{"id":55,"topic":"Project Management and Estimation","bonus":false,"q":"A use case contains five transactions. What complexity and weight apply in the Use Case Points method?","options":[{"letter":"A","text":"Simple, weight 5"},{"letter":"B","text":"Complex, weight 15"},{"letter":"C","text":"Average, weight 10"},{"letter":"D","text":"Average, weight 15"}],"answer":"C","rationale":"Five transactions fall in the 4–7 average band, which has weight 10. Tags: W5, Use Case Points, application.","source":"brief 9.5","flag":false},{"id":56,"topic":"Project Management and Estimation","bonus":false,"q":"In Use Case Point estimation, how is a human interacting through a graphical interface classified?","options":[{"letter":"A","text":"Simple actor, weight 1"},{"letter":"B","text":"Average actor, weight 2"},{"letter":"C","text":"Complex actor, weight 3"},{"letter":"D","text":"Complex actor, weight 5"}],"answer":"C","rationale":"A human using a GUI or text interface is a complex actor with weight 3. Tags: W5, Use Case Points, discrimination.","source":"brief 9.5","flag":false},{"id":57,"topic":"Project Management and Estimation","bonus":false,"q":"Using the module's weighted-duration formula, what duration results from OD = 4 days, ED = 7 days and PD = 16 days?","options":[{"letter":"A","text":"7 days"},{"letter":"B","text":"9 days"},{"letter":"C","text":"10 days"},{"letter":"D","text":"8 days"}],"answer":"D","rationale":"The weighted duration is `(4 + 4×7 + 16)/6 = 8` days. Tags: W5, duration estimation, application.","source":"brief 9.6","flag":false},{"id":58,"topic":"Cross-Cutting Distinctions","bonus":false,"q":"Which pairing correctly distinguishes the Function Point and Use Case Point technical-complexity calculations?","options":[{"letter":"A","text":"FP uses 13 factors and `0.6 + 0.01 × DI`; UCP uses 14 factors and `0.65 + 0.01 × DI`."},{"letter":"B","text":"FP uses 14 factors and `0.65 + 0.01 × DI`; UCP uses 13 factors and `0.6 + 0.01 × DI`."},{"letter":"C","text":"Both use 14 factors and `0.65 + 0.01 × DI`."},{"letter":"D","text":"Both use 13 factors and `0.6 + 0.01 × DI`."}],"answer":"B","rationale":"FP uses 14 factors and constant 0.65; UCP uses 13 weighted factors and constant 0.6. Tags: cross-cutting, TCF formulas, discrimination.","source":"brief 11.4","flag":false},{"id":59,"topic":"Cross-Cutting Distinctions","bonus":false,"q":"Which modelling choice correctly separates activity diagrams from sequence diagrams?","options":[{"letter":"A","text":"Use an activity diagram for object messages over time and a sequence diagram for workflow branching."},{"letter":"B","text":"Use an activity diagram for workflow decisions and parallelism and a sequence diagram for participant messages over time."},{"letter":"C","text":"Use an activity diagram for class ownership and a sequence diagram for use-case prioritisation."},{"letter":"D","text":"Use an activity diagram for static class structure and a sequence diagram for project scheduling."}],"answer":"B","rationale":"Activity diagrams model workflow and parallelism; sequence diagrams model participant messages over time. Tags: cross-cutting, diagram selection, discrimination.","source":"brief 11.3","flag":false},{"id":60,"topic":"Cross-Cutting Distinctions","bonus":false,"q":"A team is early in a project and has use cases, but not enough detailed requirements to count Function Points reliably. Which size metric best fits this situation?","options":[{"letter":"A","text":"Lines of Code, because it is accurately known before implementation"},{"letter":"B","text":"Use Case Points, because they support early estimation from use cases"},{"letter":"C","text":"Function Points, because they require less requirements detail than use cases"},{"letter":"D","text":"COCOMO, because it is itself a software-size metric"}],"answer":"B","rationale":"UCP supports early estimation from use cases, while FP requires greater requirements detail and LOC is known accurately only at completion. Tags: cross-cutting, size metrics, application.","source":"brief 11.4","flag":false}]}];
const KEY = "revision-quiz-v2";
const el = id => document.getElementById(id);

let st = { theme:"dark", active: QUIZZES[0].id, byQuiz: {} };

function blank(){ return { idx:0, mode:"mcq", topic:"", shuffled:false, results:{}, picks:{},
  flagged:[], revealed:[], typed:{}, retryIds:[], retry:false }; }
function qz(){ return QUIZZES.find(q => q.id === st.active) || QUIZZES[0]; }
function qs(){ if(!st.byQuiz[st.active]) st.byQuiz[st.active] = blank(); return st.byQuiz[st.active]; }
function load(){ try{ const r = localStorage.getItem(KEY); if(r) st = Object.assign(st, JSON.parse(r)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

function pool(){
  const s = qs();
  let p = qz().questions.slice();
  if(s.retry && s.retryIds.length) p = p.filter(q => s.retryIds.includes(q.id));
  else if(s.topic) p = p.filter(q => q.topic === s.topic);
  if(s.shuffled) p = p.map(q => [Math.random(), q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  return p;
}
function current(){ const p = pool(); if(!p.length) return null; return p[Math.min(qs().idx, p.length-1)]; }
function displayOptions(q){
  let o = q.options.slice();
  if(qs().shuffled) o = o.map(x => [Math.random(), x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  return o;
}
const letter = i => String.fromCharCode(65 + i);

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderTabs(){
  const html = QUIZZES.map(q => {
    const s = st.byQuiz[q.id] || {};
    const done = Object.keys(s.results || {}).length;
    return '<button class="tab" role="tab" data-quiz="'+q.id+'" aria-selected="'+(q.id===st.active)+'">'+
           '<span>'+esc(q.short)+'</span><span class="cnt">'+done+'/'+q.questions.length+'</span></button>';
  }).join("");
  el("tabs").innerHTML = html;
}

function render(){
  const s = qs(), quiz = qz(), p = pool();
  el("title").textContent = quiz.label;
  el("subtitle").innerHTML = quiz.sub + " &middot; " + quiz.questions.length + " questions";
  renderTabs();

  if(s.idx >= p.length) s.idx = Math.max(0, p.length - 1);
  const q = current();
  el("total").textContent = p.length;
  el("pos").textContent = p.length ? s.idx + 1 : 0;

  const answered = Object.keys(s.results).length;
  const right = Object.values(s.results).filter(v => v === "right").length;
  el("done").textContent = answered + "/" + quiz.questions.length;
  el("score").textContent = answered ? Math.round(right / answered * 100) + "%" : "\u2014";
  el("flagCount").textContent = s.flagged.length;
  el("barFill").style.width = (answered / quiz.questions.length * 100) + "%";

  if(!q){ el("card").innerHTML = '<div class="empty">No questions in this filter.</div>';
          el("nextBtn").disabled = true; el("prevBtn").disabled = true; return; }

  const res = s.results[q.id];
  const badges = ['<span class="pill topic">'+esc(q.topic)+'</span>',
                  '<span class="pill">Q'+q.id+'</span>'];
  if(q.bonus) badges.push('<span class="pill bonus">bonus</span>');
  if(q.flag)  badges.push('<span class="pill flag">verify</span>');
  if(s.flagged.includes(q.id)) badges.push('<span class="pill flag">flagged</span>');

  let body = "";
  if(s.mode === "mcq"){
    const opts = displayOptions(q);
    body = '<div class="opts">' + opts.map((o, i) => {
      let cls = "opt";
      if(res){
        const picked = s.picks[q.id];
        if(o.letter === q.answer) cls += " correct";
        else if(picked === o.letter) cls += " wrong";
        else cls += " dim";
      }
      return '<button class="'+cls+'" data-letter="'+o.letter+'" '+(res?"disabled":"")+'>'+
             '<span class="key">'+letter(i)+'</span><span>'+esc(o.text)+'</span></button>';
    }).join("") + '</div>';
  } else {
    const shown = s.revealed.includes(q.id);
    body = '<textarea id="typedBox" placeholder="Type your answer, then reveal..." '+
           (shown?"disabled":"")+'>'+esc(s.typed[q.id]||"")+'</textarea>'+
           '<div class="nav"><div class="spacer"></div>'+
           (shown ? "" : '<button class="btn primary" id="revealBtn">Reveal answer</button>')+'</div>';
    if(shown){
      const correct = q.options.find(o => o.letter === q.answer) || {text:"(see rationale)"};
      body += '<div class="fb"><div class="model">Model answer: <b>'+esc(correct.text)+'</b></div>'+
              (res ? '<div class="verdict '+(res==="right"?"ok":"bad")+'">Currently marked: '+
                     (res==="right"?"got it":"missed it")+'</div>' : "")+
              '<div class="nav"><button class="btn" data-mark="wrong">Missed it</button>'+
              '<button class="btn primary" data-mark="right">Got it</button></div></div>';
    }
  }

  let fb = "";
  if(res){
    fb = '<div class="fb">' +
      (s.mode === "mcq"
        ? '<div class="verdict '+(res==="right"?"ok":"bad")+'">'+(res==="right"?"\u2713 Correct":"\u2717 Incorrect")+
          ' &mdash; answer is '+q.answer+'</div>'
        : "") +
      '<div class="rat">'+esc(q.rationale)+'</div>' +
      '<div class="src">'+esc(q.source)+'</div></div>';
  }

  el("card").innerHTML = '<div class="badges">'+badges.join("")+'</div>' +
    '<p class="qtext">'+esc(q.q)+'</p>' + body + fb;

  el("prevBtn").disabled = s.idx === 0;
  el("nextBtn").disabled = false;
  el("nextBtn").textContent = (s.idx === p.length - 1) ? "Show summary" : "Next \u2192";
  el("flagBtn").textContent = s.flagged.includes(q.id) ? "Unflag" : "Flag";
  el("modeMcq").setAttribute("aria-pressed", s.mode === "mcq");
  el("modeTyped").setAttribute("aria-pressed", s.mode === "typed");
  el("topicSel").value = s.topic;
  el("shuffleBtn").textContent = s.shuffled ? "Shuffled \u2713" : "Shuffle";
  el("wrongBtn").textContent = s.retry ? "Retrying wrong \u2713 ("+s.retryIds.length+")" : "Retry wrong";
}

function answerMcq(l){
  const q = current(); if(!q) return; const s = qs();
  if(s.results[q.id]) return;
  s.picks[q.id] = l;
  s.results[q.id] = (l === q.answer) ? "right" : "wrong";
  save(); render();
}
function mark(ok){
  const q = current(); if(!q) return;
  qs().results[q.id] = ok ? "right" : "wrong";
  save(); render();
}
function next(){
  const s = qs(), p = pool();
  if(s.idx >= p.length - 1){ showSummary(); return; }
  s.idx++; save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function showSummary(){
  const s = qs(), quiz = qz();
  const byTopic = {};
  quiz.questions.forEach(q => {
    const r = s.results[q.id]; if(!r) return;
    byTopic[q.topic] = byTopic[q.topic] || {right:0,total:0};
    byTopic[q.topic].total++;
    if(r === "right") byTopic[q.topic].right++;
  });
  const done = Object.keys(s.results).length;
  const right = Object.values(s.results).filter(v => v === "right").length;
  const rows = Object.entries(byTopic).map(([t,v]) =>
    '<tr><td>'+esc(t)+'</td><td class="num">'+v.right+' / '+v.total+'</td>'+
    '<td class="num">'+Math.round(v.right/v.total*100)+'%</td></tr>').join("");
  const wrongIds = Object.entries(s.results).filter(([,v]) => v==="wrong").map(([k]) => "Q"+k);
  el("summary").style.display = "block";
  el("summary").innerHTML =
    '<h2>'+esc(quiz.label)+' &mdash; progress</h2>'+
    '<div class="scorebig">'+(done?Math.round(right/done*100):0)+'%</div>'+
    '<div class="scorable">'+right+' right of '+done+' answered &middot; '+quiz.questions.length+' in this bank'+
    (s.flagged.length ? ' &middot; flagged: '+s.flagged.map(i=>"Q"+i).join(", ") : "")+'</div>'+
    (rows ? '<table style="margin-top:18px"><tr><th>Topic</th><th class="num">Score</th><th class="num">%</th></tr>'+rows+'</table>' : "")+
    (wrongIds.length ? '<p class="scorable" style="margin-top:14px">Missed: '+wrongIds.join(", ")+'</p>' : "");
  el("summary").scrollIntoView({behavior:"smooth"});
}

function selectQuiz(id){
  st.active = id; save();
  el("summary").style.display = "none";
  const sel = el("topicSel");
  sel.innerHTML = '<option value="">All topics</option>';
  qz().questions.map(q => q.topic).filter((v,i,a) => a.indexOf(v) === i).forEach(t => {
    const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o);
  });
  render();
}

/* ---- wiring ---- */
load();
if(!QUIZZES.some(q => q.id === st.active)) st.active = QUIZZES[0].id;
if(!st.byQuiz[st.active]) st.byQuiz[st.active] = blank();
document.documentElement.setAttribute("data-theme", st.theme);
el("themeBtn").textContent = st.theme === "dark" ? "\u263C" : "\u263E";

el("themeBtn").onclick = () => {
  st.theme = st.theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", st.theme);
  el("themeBtn").textContent = st.theme === "dark" ? "\u263C" : "\u263E";
  save();
};
el("tabs").onclick = e => {
  const b = e.target.closest(".tab"); if(!b) return;
  selectQuiz(b.dataset.quiz);
};
el("modeMcq").onclick = () => { qs().mode = "mcq"; save(); render(); };
el("modeTyped").onclick = () => { qs().mode = "typed"; save(); render(); };
el("topicSel").onchange = e => {
  const s = qs();
  s.topic = e.target.value; s.retry = false; s.retryIds = []; s.idx = 0; save(); render();
};
el("shuffleBtn").onclick = () => { const s = qs(); s.shuffled = !s.shuffled; s.idx = 0; save(); render(); };
el("wrongBtn").onclick = () => {
  const s = qs();
  if(s.retry){ s.retry = false; s.retryIds = []; s.idx = 0; save(); render(); return; }
  const ids = qz().questions.filter(q => s.results[q.id] === "wrong").map(q => q.id);
  if(!ids.length){ alert("No wrong answers recorded yet in this quiz \u2014 answer some questions first."); return; }
  s.retryIds = ids; s.retry = true; s.idx = 0;
  ids.forEach(id => { delete s.results[id]; delete s.picks[id]; });
  save(); render();
};
el("sumBtn").onclick = showSummary;
el("resetBtn").onclick = () => {
  if(!confirm("Clear all answers, flags and progress for "+qz().label+"?")) return;
  const theme = st.theme;
  st.byQuiz[st.active] = blank(); st.theme = theme;
  el("summary").style.display = "none"; save(); render();
};
el("prevBtn").onclick = () => { const s = qs(); if(s.idx > 0){ s.idx--; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); } };
el("nextBtn").onclick = next;
el("flagBtn").onclick = () => {
  const q = current(); if(!q) return; const s = qs();
  const i = s.flagged.indexOf(q.id);
  if(i >= 0) s.flagged.splice(i,1); else s.flagged.push(q.id);
  save(); render();
};

el("card").addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if(opt && !opt.disabled){ answerMcq(opt.dataset.letter); return; }
  const mk = e.target.closest("[data-mark]");
  if(mk){ mark(mk.dataset.mark === "right"); return; }
  if(e.target.id === "revealBtn"){
    const q = current(), s = qs();
    s.typed[q.id] = (el("typedBox") || {}).value || "";
    if(!s.revealed.includes(q.id)) s.revealed.push(q.id);
    save(); render(); return;
  }
});
el("card").addEventListener("input", e => {
  if(e.target.id === "typedBox"){ const q = current(); qs().typed[q.id] = e.target.value; save(); }
});

document.addEventListener("keydown", e => {
  if(e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  const s = qs(), k = e.key.toUpperCase();
  if(s.mode === "mcq" && k.length === 1 && "ABCD".includes(k)){ answerMcq(k); return; }
  if(s.mode === "mcq" && "1234".includes(k)){ answerMcq(letter(+k - 1)); return; }
  if(e.key === "Enter"){ e.preventDefault(); next(); return; }
  if(k === "F"){ el("flagBtn").click(); }
});

selectQuiz(st.active);
</script>
