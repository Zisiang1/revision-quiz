:false},{"id":54,"topic":"Project Management and Estimation","bonus":false,"q":"A Function Point assessment has a Degree of Influence of 35. What is its Technical Complexity Factor?","options":[{"letter":"A","text":"0.95"},{"letter":"B","text":"1.02"},{"letter":"C","text":"1.35"},{"letter":"D","text":"1.00"}],"answer":"D","rationale":"FP TCF is `0.65 + 0.01×35 = 1.00`. Tags: W5, Function Points, application.","source":"brief 9.4","flag":false},{"id":55,"topic":"Project Management and Estimation","bonus":false,"q":"A use case contains five transactions. What complexity and weight apply in the Use Case Points method?","options":[{"letter":"A","text":"Simple, weight 5"},{"letter":"B","text":"Complex, weight 15"},{"letter":"C","text":"Average, weight 10"},{"letter":"D","text":"Average, weight 15"}],"answer":"C","rationale":"Five transactions fall in the 4–7 average band, which has weight 10. Tags: W5, Use Case Points, application.","source":"brief 9.5","flag":false},{"id":56,"topic":"Project Management and Estimation","bonus":false,"q":"In Use Case Point estimation, how is a human interacting through a graphical interface classified?","options":[{"letter":"A","text":"Simple actor, weight 1"},{"letter":"B","text":"Average actor, weight 2"},{"letter":"C","text":"Complex actor, weight 3"},{"letter":"D","text":"Complex actor, weight 5"}],"answer":"C","rationale":"A human using a GUI or text interface is a complex actor with weight 3. Tags: W5, Use Case Points, discrimination.","source":"brief 9.5","flag":false},{"id":57,"topic":"Project Management and Estimation","bonus":false,"q":"Using the module's weighted-duration formula, what duration results from OD = 4 days, ED = 7 days and PD = 16 days?","options":[{"letter":"A","text":"7 days"},{"letter":"B","text":"9 days"},{"letter":"C","text":"10 days"},{"letter":"D","text":"8 days"}],"answer":"D","rationale":"The weighted duration is `(4 + 4×7 + 16)/6 = 8` days. Tags: W5, duration estimation, application.","source":"brief 9.6","flag":false},{"id":58,"topic":"Cross-Cutting Distinctions","bonus":false,"q":"Which pairing correctly distinguishes the Function Point and Use Case Point technical-complexity calculations?","options":[{"letter":"A","text":"FP uses 13 factors and `0.6 + 0.01 × DI`; UCP uses 14 factors and `0.65 + 0.01 × DI`."},{"letter":"B","text":"FP uses 14 factors and `0.65 + 0.01 × DI`; UCP uses 13 factors and `0.6 + 0.01 × DI`."},{"letter":"C","text":"Both use 14 factors and `0.65 + 0.01 × DI`."},{"letter":"D","text":"Both use 13 factors and `0.6 + 0.01 × DI`."}],"answer":"B","rationale":"FP uses 14 factors and constant 0.65; UCP uses 13 weighted factors and constant 0.6. Tags: cross-cutting, TCF formulas, discrimination.","source":"brief 11.4","flag":false},{"id":59,"topic":"Cross-Cutting Distinctions","bonus":false,"q":"Which modelling choice correctly separates activity diagrams from sequence diagrams?","options":[{"letter":"A","text":"Use an activity diagram for object messages over time and a sequence diagram for workflow branching."},{"letter":"B","text":"Use an activity diagram for workflow decisions and parallelism and a sequence diagram for participant messages over time."},{"letter":"C","text":"Use an activity diagram for class ownership and a sequence diagram for use-case prioritisation."},{"letter":"D","text":"Use an activity diagram for static class structure and a sequence diagram for project scheduling."}],"answer":"B","rationale":"Activity diagrams model workflow and parallelism; sequence diagrams model participant messages over time. Tags: cross-cutting, diagram selection, discrimination.","source":"brief 11.3","flag":false},{"id":60,"topic":"Cross-Cutting Distinctions","bonus":false,"q":"A team is early in a project and has use cases, but not enough detailed requirements to count Function Points reliably. Which size metric best fits this situation?","options":[{"letter":"A","text":"Lines of Code, because it is accurately known before implementation"},{"letter":"B","text":"Use Case Points, because they support early estimation from use cases"},{"letter":"C","text":"Function Points, because they require less requirements detail than use cases"},{"letter":"D","text":"COCOMO, because it is itself a software-size metric"}],"answer":"B","rationale":"UCP supports early estimation from use cases, while FP requires greater requirements detail and LOC is known accurately only at completion. Tags: cross-cutting, size metrics, application.","source":"brief 11.4","flag":false}]},{"id":"inf2001q2","label":"INF2001 Quiz 2","short":"INF2001 Q2","sub":"Intro to Software Engineering &middot; Weeks 8&ndash;12 &middot; multi-select included","questions":[{"id":1,"topic":"Component diagrams","multi":false,"q":"In a UML component diagram, how is the fact that a component needs a service provided elsewhere shown?","options":[{"letter":"A","text":"A facet (lollipop) attached to the component"},{"letter":"B","text":"A box carrying the plug widget stereotype"},{"letter":"C","text":"A shaded box on the component's boundary"},{"letter":"D","text":"A connector called a receptacle drawn around the facet (a socket)"}],"answer":"D","rationale":"Deck: component B requires interface I, denoted by a connector called a receptacle drawn around the facet. The lollipop is the *provided* side.","source":"§2 / Lecture/W8/1 ...ComponentDiagram_postLEC.md:96-115","flag":false},{"id":2,"topic":"Component diagrams","multi":false,"q":"How is a «delegate» connector drawn?","options":[{"letter":"A","text":"A solid line with no arrowhead"},{"letter":"B","text":"A solid line with a filled arrowhead"},{"letter":"C","text":"A dashed line with an open arrowhead"},{"letter":"D","text":"A dashed line with a closed arrowhead"}],"answer":"A","rationale":"The deck states explicitly: to keep consistent with UML 2.5.1 (p.214) a solid line and no arrowhead is used for <<delegate>>.","source":"§2 / Lecture/W8/1 ...ComponentDiagram_postLEC.md:124-132","flag":false},{"id":3,"topic":"Component diagrams","multi":false,"q":"What is the shaded box on a component's boundary, through which an interface is provided and delegation is drawn, called?","options":[{"letter":"A","text":"A port"},{"letter":"B","text":"A facet"},{"letter":"C","text":"A receptacle"},{"letter":"D","text":"A stereotype"}],"answer":"A","rationale":"Component A delegates responsibility for interface I to a sub-component; the dependency is drawn to a shaded box on A's boundary, and that shaded box is called a port.","source":"§2 / Lecture/W8/1 ...ComponentDiagram_postLEC.md:124-161","flag":false},{"id":4,"topic":"Component diagrams","multi":false,"q":"A component diagram is under review. Which of the following is ACCEPTABLE rather than a mistake?","options":[{"letter":"A","text":"Leaving a lollipop with no matching socket anywhere in the diagram, other than to an external component"},{"letter":"B","text":"Sharing a line between two connectors to save space"},{"letter":"C","text":"Making the dashboard a separate component"},{"letter":"D","text":"Giving one component both a required and a provided interface"}],"answer":"D","rationale":"The list says a component can have both a required and a provided interface; the other three are named mistakes (dangling notation is allowed only to external components).","source":"§2 / Lecture/W8/1 ...ComponentDiagram_postLEC.md:434-448","flag":false},{"id":5,"topic":"Component diagrams","multi":false,"q":"A software component is best described as:","options":[{"letter":"A","text":"A single class with public and private members"},{"letter":"B","text":"A diagram showing the order of messages between objects"},{"letter":"C","text":"An independent unit encapsulating semantically related data and functions, at a higher level of abstraction than an object"},{"letter":"D","text":"A deployment node that hosts the compiled artefacts"}],"answer":"C","rationale":"Definition slide: components are higher-level abstractions than objects, hide their internal structure and collaborate through well-defined interfaces.","source":"§2 / Lecture/W8/1 ...ComponentDiagram_postLEC.md:64-77","flag":false},{"id":6,"topic":"Component diagrams","multi":false,"q":"A component diagram already shows Subscription Management and Dissemination. Your reviewer asks where the production database should appear.","options":[{"letter":"A","text":"The class diagram"},{"letter":"B","text":"The architecture diagram"},{"letter":"C","text":"The component diagram"},{"letter":"D","text":"The sequence diagram"}],"answer":"B","rationale":"The database is a platform/deployment decision, not a unit of software design; components hide internals, so storage belongs to the architecture view.","source":"Brief §2, component vs class diagram; §4, architecture","flag":false},{"id":7,"topic":"Component diagrams","multi":false,"q":"In the client collection system example, which component actually requires the ISchedule interface?","options":[{"letter":"A","text":"ClientManager, with the requirement delegated to Port 2"},{"letter":"B","text":"The client collection system itself"},{"letter":"C","text":"SensorManager"},{"letter":"D","text":"VideoManager"}],"answer":"A","rationale":"The system requires ISchedule, but the interface is actually required by ClientManager, which delegates it to Port 2; IClientData is provided via Port 1 and delegated to ClientManager.","source":"§2 / Lecture/W8/1 ...ComponentDiagram_postLEC.md:284-306","flag":false},{"id":8,"topic":"Component diagrams","multi":false,"q":"A single provided-interface ball (lollipop) may be:","options":[{"letter":"A","text":"Attached to exactly one component, by UML rule"},{"letter":"B","text":"Shared by more than one component"},{"letter":"C","text":"Used only on external components"},{"letter":"D","text":"Drawn only together with a port"}],"answer":"B","rationale":"The common-mistakes slide closes with 'A ball can be shared by more than one component.'","source":"§2 / Lecture/W8/1 ...ComponentDiagram_postLEC.md:434-448","flag":false},{"id":9,"topic":"Component diagrams","multi":false,"q":"Ports and delegation serve two different purposes. Which pairing is correct?","options":[{"letter":"A","text":"Ports model internal class ownership; delegation models inheritance"},{"letter":"B","text":"Ports model required interfaces only; delegation models provided interfaces only"},{"letter":"C","text":"Ports model compilation units; delegation models deployment"},{"letter":"D","text":"Ports model access points for the external environment; delegation models the link between an external provided interface and its internal realisation"}],"answer":"D","rationale":"Deck: 'Ports are used to model access points for allowing external environment access to component services' and delegation models 'the link between external provided interfaces to the realization of those interfaces internally'.","source":"§2 / Lecture/W8/1 ...ComponentDiagram_postLEC.md:149-161","flag":false},{"id":10,"topic":"Component diagrams","multi":true,"q":"You are reviewing a teammate's component diagram. It shows (i) a ball labelled IClientData that nothing connects to and that faces no external system, (ii) a shaded square on the boundary with no interface attached, (iii) the production database drawn as a component, and (iv) a component carrying both a ball and a socket. Which of these are errors? (select all that apply)","options":[{"letter":"A","text":"(i) the dangling ball"},{"letter":"B","text":"(ii) a port with no interface attached"},{"letter":"C","text":"(iii) the database drawn as a component"},{"letter":"D","text":"(iv) a component with both provided and required interfaces"}],"answer":["A","B","C"],"rationale":"(i) is a dangling interface unless it faces an external system, (ii) a port exists to expose an interface, and (iii) the database belongs in the architecture diagram. (iv) is correct and explicitly allowed.","source":"Brief §2, common mistakes list","flag":false},{"id":11,"topic":"SE design","multi":false,"q":"Which statement is the definition of software engineering design?","options":[{"letter":"A","text":"The process of writing and documenting source code"},{"letter":"B","text":"The activity of testing the system against its acceptance criteria"},{"letter":"C","text":"The phase where requirements are elicited from the client"},{"letter":"D","text":"The process of identifying, evaluating, validating and specifying the architectural, detailed and construction models required to meet functional and non-functional requirements — and the product of that process"}],"answer":"D","rationale":"Design names three model levels (architectural, detailed, construction) and is both a process and its product.","source":"Brief §3, definition","flag":false},{"id":12,"topic":"SE design","multi":false,"q":"Which design activity provides black-box models used to evaluate the system's projected capabilities?","options":[{"letter":"A","text":"Construction design"},{"letter":"B","text":"Detailed design"},{"letter":"C","text":"Software architecture"},{"letter":"D","text":"Human-computer interface design"}],"answer":"C","rationale":"Architecture is the macrodesign approach providing black-box models; detailed design provides the white-box elements.","source":"§3 / Lecture/W8/2 ...Design_postLEC.md:152-162","flag":false},{"id":13,"topic":"SE design","multi":false,"q":"Detailed design focuses mainly on which requirements, and with which two major tasks?","options":[{"letter":"A","text":"Non-functional requirements; scalability and security"},{"letter":"B","text":"Functional requirements; interface design and component design"},{"letter":"C","text":"Functional requirements; deployment and release"},{"letter":"D","text":"Non-functional requirements; usability and portability"}],"answer":"B","rationale":"Deck: detailed design addresses functional requirements with two major tasks — interface design and component design.","source":"§3 / Lecture/W8/2 ...Design_postLEC.md:152-162","flag":false},{"id":14,"topic":"SE design","multi":false,"q":"Which combination of coupling and cohesion is desirable?","options":[{"letter":"A","text":"Tight coupling and high cohesion"},{"letter":"B","text":"Loose coupling and low cohesion"},{"letter":"C","text":"Loose coupling and high cohesion"},{"letter":"D","text":"Tight coupling and low cohesion"}],"answer":"C","rationale":"High cohesion is good and low cohesion bad; loose coupling is good and tight coupling bad — so loose + high is the target.","source":"§3 / Lecture/W8/2 ...Design_postLEC.md:270-277","flag":false},{"id":15,"topic":"SE design","multi":false,"q":"Completeness and sufficiency are paired design principles. Which statement is correct?","options":[{"letter":"A","text":"Completeness means providing no more than is needed; sufficiency means providing no less"},{"letter":"B","text":"Completeness means providing no less than the required services; sufficiency means providing only the services sufficient for the intent (no more)"},{"letter":"C","text":"Completeness applies to classes; sufficiency applies to components only"},{"letter":"D","text":"Both mean that the design must deliver every imaginable feature"}],"answer":"B","rationale":"Deck: completeness measures how well units provide the required services (no less); sufficiency measures how well they provide only what is sufficient (no more).","source":"§3 / Lecture/W8/2 ...Design_postLEC.md:293-297","flag":false},{"id":16,"topic":"SE design","multi":false,"q":"Separation of interface and implementation means that:","options":[{"letter":"A","text":"The interface is hidden and the implementation is visible to clients"},{"letter":"B","text":"Every class must expose all its fields as public"},{"letter":"C","text":"The interface is visible to clients, separate from the hidden details of how it is realised"},{"letter":"D","text":"Interfaces are drawn only in component diagrams"}],"answer":"C","rationale":"Deck: define a component by a public interface known to clients, separate from the details of how the component is realised — interface visible, implementation hidden.","source":"§3 / Lecture/W8/2 ...Design_postLEC.md:280-290","flag":false},{"id":17,"topic":"SE design","multi":false,"q":"Which benefit of good software design is described from the PROJECT MANAGEMENT perspective?","options":[{"letter":"A","text":"It minimises the impact of requirements volatility on schedule and cost"},{"letter":"B","text":"It identifies the main components and interfaces"},{"letter":"C","text":"It forms the foundation for testing and maintenance"},{"letter":"D","text":"It makes solutions reusable in other projects"}],"answer":"A","rationale":"The project-management slides list volatility shielding, avoiding 'one guy' owning the system, parallel/distributed teams and better planning; the other options are the product-development slide.","source":"§3 / Lecture/W8/2 ...Design_postLEC.md:58-85","flag":false},{"id":18,"topic":"SE design","multi":true,"q":"A repository interface offers findById, findAll, save and exportToCsv. Two callers also need delete, which the interface lacks, and no caller uses exportToCsv. Which principles are being violated? (select all that apply)","options":[{"letter":"A","text":"Completeness — a required service is missing"},{"letter":"B","text":"Sufficiency — a service nobody needs is offered"},{"letter":"C","text":"Cohesion — the methods belong to different responsibilities"},{"letter":"D","text":"Separation of interface and implementation — the interface exposes its internals"}],"answer":["A","B"],"rationale":"Completeness means no less than what callers require; sufficiency means no more than the intent needs. Missing delete breaks completeness, unused exportToCsv breaks sufficiency.","source":"Brief §3, seven design principles","flag":false},{"id":19,"topic":"Architecture","multi":false,"q":"The C4 model breaks a software system into four levels. What are they, in order?","options":[{"letter":"A","text":"Class, Component, Configuration, Concurrency"},{"letter":"B","text":"Context, Container, Component, Code"},{"letter":"C","text":"Context, Component, Container, Code"},{"letter":"D","text":"Container, Context, Code, Component"}],"answer":"B","rationale":"C4 = Context, Container, Component, Code; the deck notes levels 1 and 2 are usually sufficient for most teams.","source":"§4 / Lecture/W9/INF2001-W9_Architectural Pattern_preLEC.md:201-245","flag":false},{"id":20,"topic":"Architecture","multi":false,"q":"For most software teams, which C4 levels are usually sufficient?","options":[{"letter":"A","text":"Level 1 (system context) and level 2 (container)"},{"letter":"B","text":"Level 3 (component) and level 4 (code)"},{"letter":"C","text":"Level 2 (container) and level 3 (component)"},{"letter":"D","text":"All four levels are required for any team"}],"answer":"A","rationale":"Deck: 'System context and container diagrams are usually sufficient for most software development teams.'","source":"§4 / Lecture/W9/INF2001-W9_Architectural Pattern_preLEC.md:201-219","flag":false},{"id":21,"topic":"Architecture","multi":false,"q":"In the 4+1 view model, which view is documented with a deployment diagram?","options":[{"letter":"A","text":"Logical view"},{"letter":"B","text":"Process view"},{"letter":"C","text":"Development view"},{"letter":"D","text":"Physical view"}],"answer":"D","rationale":"The physical/deployment view is the system engineer's perspective — topology of components on the physical layer; deployment diagram.","source":"§4 / Lecture/W9/INF2001-W9_Architectural Pattern_preLEC.md:272-293","flag":false},{"id":22,"topic":"Architecture","multi":false,"q":"Which 4+1 view focuses on the run-time behaviour of the system and how processes communicate?","options":[{"letter":"A","text":"Logical view"},{"letter":"B","text":"Development view"},{"letter":"C","text":"Process view"},{"letter":"D","text":"Use case view"}],"answer":"C","rationale":"Process view = dynamic aspects, processes and their communication, run-time behaviour; sequence, communication and activity diagrams.","source":"§4 / Lecture/W9/INF2001-W9_Architectural Pattern_preLEC.md:272-293","flag":false},{"id":23,"topic":"Architecture","multi":false,"q":"The Blackboard pattern belongs to which architectural classification, and for which example system type?","options":[{"letter":"A","text":"Data-centred; a central repository accessed by clients, e.g. an IDE or student information system"},{"letter":"B","text":"Data flow; a stream that is transported and transformed, e.g. sensor data processing"},{"letter":"C","text":"Distributed; independent units over a network, e.g. email"},{"letter":"D","text":"Interactive; a user-centric system, e.g. an e-shopping site"}],"answer":"A","rationale":"Classification table: data-centred → Blackboard, examples IDE and student information system.","source":"§4 / Lecture/W9/INF2001-W9_Architectural Pattern_preLEC.md:342-394","flag":false},{"id":24,"topic":"Architecture","multi":false,"q":"Which pattern is paired with the data-flow classification?","options":[{"letter":"A","text":"Broker"},{"letter":"B","text":"Model-View-Controller"},{"letter":"C","text":"Main program and subroutine"},{"letter":"D","text":"Pipe and filter"}],"answer":"D","rationale":"Data flow → pipe and filter (example: sensor data processing system). Broker is distributed; main program and subroutine is hierarchical; MVC is interactive.","source":"§4 / Lecture/W9/INF2001-W9_Architectural Pattern_preLEC.md:373-394","flag":false},{"id":25,"topic":"Architecture","multi":false,"q":"In a layered architecture, what does it mean that the layers are 'closed'?","options":[{"letter":"A","text":"A request moving from layer to layer must pass through the layer directly below it to reach the bottom layer"},{"letter":"B","text":"Each layer may call any other layer directly"},{"letter":"C","text":"The layers cannot be modified after release"},{"letter":"D","text":"Only the presentation layer may be changed"}],"answer":"A","rationale":"Closed layers: a request must go through the layer right below it to get to the bottom layer; layers of isolation mean changes stay local.","source":"§4 / Lecture/W9/INF2001-W9_Architectural Pattern_preLEC.md:461-493","flag":false},{"id":26,"topic":"Architecture","multi":false,"q":"In MVC, which component presents data to the user, allows interaction, and does no processing?","options":[{"letter":"A","text":"The model"},{"letter":"B","text":"The repository"},{"letter":"C","text":"The controller"},{"letter":"D","text":"The view"}],"answer":"D","rationale":"View: presents data, allows user interaction, does no processing. Model holds domain knowledge; controller controls the flow and receives messages from the view.","source":"§4 / Lecture/W9/INF2001-W9_Architectural Pattern_preLEC.md:570-620","flag":false},{"id":27,"topic":"Architecture","multi":true,"q":"Which statements about SOFTWARE ARCHITECTURE are correct? (select all that apply)","options":[{"letter":"A","text":"It provides black-box models used to evaluate the system's projected capabilities"},{"letter":"B","text":"It focuses on non-functional (quality) requirements"},{"letter":"C","text":"It lays the foundation for all subsequent work in the life cycle"},{"letter":"D","text":"It focuses on functional requirements with interface and component design as its two tasks"},{"letter":"E","text":"It is a lower level of design than detailed design"}],"answer":["A","B","C"],"rationale":"Options 4 and 5 describe *detailed* design, which follows architecture and provides white-box, functional design.","source":"§3, §4 / Lecture/W8/2 ...Design_postLEC.md:152-162; Lecture/W9/INF2001-W9_Architectural Pattern_preLEC.md:222-245","flag":false},{"id":28,"topic":"Architecture","multi":true,"q":"To make one page load faster, a developer queries the database directly from the presentation layer and skips the business layer. In a layered design with closed layers, which consequences follow? (select all that apply)","options":[{"letter":"A","text":"Presentation now mixes UI with data access, so it is harder to test on its own"},{"letter":"B","text":"A change to the database schema can now break the UI layer"},{"letter":"C","text":"The layers stay isolated because each still has a single role"},{"letter":"D","text":"Validation and business rules are no longer enforced in one place"}],"answer":["A","B","D"],"rationale":"Closed layers exist so a request passes through each layer and each layer owns one concern. Short-circuiting moves data access into the UI, couples the UI to the schema, and scatters business rules.","source":"Brief §4, layered architecture","flag":false},{"id":29,"topic":"Architecture","multi":true,"q":"Which are views of the 4+1 architectural model? (select all that apply)","options":[{"letter":"A","text":"Logical"},{"letter":"B","text":"Process"},{"letter":"C","text":"Development (implementation)"},{"letter":"D","text":"Physical (deployment)"},{"letter":"E","text":"Concurrency"},{"letter":"F","text":"Security"}],"answer":["A","B","C","D"],"rationale":"The four views are logical, process, development/implementation and physical/deployment, illustrated by the fifth view — use cases/scenarios. Concurrency and security are not views in this model.","source":"§4 / Lecture/W9/INF2001-W9_Architectural Pattern_preLEC.md:249-302","flag":false},{"id":30,"topic":"Architecture","multi":true,"q":"A stakeholder wants the view of the system that shows the functionality it provides to end users — its functional structure. Which diagrams serve the 4+1 logical view? (select all that apply)","options":[{"letter":"A","text":"Class diagram"},{"letter":"B","text":"State diagram"},{"letter":"C","text":"Component diagram"},{"letter":"D","text":"Deployment diagram"},{"letter":"E","text":"Activity diagram"}],"answer":["A","B","C"],"rationale":"The logical view covers functionality and is illustrated by class, state and component diagrams. Deployment is the physical view; activity and sequence belong to the process view.","source":"Brief §4, 4+1 view model","flag":false},{"id":31,"topic":"Design patterns","multi":false,"q":"Who are 'the Gang of Four' whose 1995 book popularised design patterns?","options":[{"letter":"A","text":"Alexander, Fowler and Beck"},{"letter":"B","text":"Booch, Rumbaugh and Jacobson"},{"letter":"C","text":"Gamma, Helm, Johnson and Vlissides"},{"letter":"D","text":"Martin, Codd and Hoare"}],"answer":"C","rationale":"Erich Gamma, Richard Helm, Ralph Johnson and John Vlissides — GoF — Design Patterns: Elements of Reusable Object-Oriented Software (1995).","source":"§5 / Lecture/W9/INF2001-W9_Design Patterns_preLEC.md:63-70","flag":false},{"id":32,"topic":"Design patterns","multi":false,"q":"Which GoF group is for 'managing relationships between objects'?","options":[{"letter":"A","text":"Creational"},{"letter":"B","text":"Behavioural"},{"letter":"C","text":"Structural"},{"letter":"D","text":"Architectural"}],"answer":"C","rationale":"Creational = instantiating objects; structural = managing relationships between objects; behavioural = implementing common behaviours.","source":"§5 / Lecture/W9/INF2001-W9_Design Patterns_preLEC.md:73-80","flag":false},{"id":33,"topic":"Design patterns","multi":false,"q":"The stated intent of the Factory pattern is to:","options":[{"letter":"A","text":"Ensure only one instance of a class exists"},{"letter":"B","text":"Define a one-to-many dependency so that when one object changes state all its dependents are notified"},{"letter":"C","text":"Convert the interface of a class into another interface clients expect"},{"letter":"D","text":"Provide a method by which objects can be created, allowing subclasses to decide which concrete class should be used"}],"answer":"D","rationale":"Factory intent slide; the options describe Singleton, Adapter and Observer respectively.","source":"§5 / Lecture/W9/INF2001-W9_Design Patterns_preLEC.md:140-150","flag":false},{"id":34,"topic":"Design patterns","multi":false,"q":"How does the Singleton pattern guarantee that only one instance exists?","options":[{"letter":"A","text":"By storing the instance in a global variable with public access"},{"letter":"B","text":"With a private static instance field, a private constructor, and a public static GetInstance()"},{"letter":"C","text":"By making the class abstract so it cannot be instantiated twice"},{"letter":"D","text":"By cloning a prototype object on each request"}],"answer":"B","rationale":"Singleton structure: -instance : Singleton, -Singleton(), +GetInstance() : Singleton.","source":"§5 / Lecture/W9/INF2001-W9_Design Patterns_preLEC.md:171-182","flag":false},{"id":35,"topic":"Design patterns","multi":false,"q":"Why is Factory.CreateProduct() often declared static?","options":[{"letter":"A","text":"Because otherwise the client must instantiate a Factory first"},{"letter":"B","text":"So that the factory can never be subclassed"},{"letter":"C","text":"Because static methods run faster"},{"letter":"D","text":"Because UML requires factory methods to be static"}],"answer":"A","rationale":"Deck: 'The Factory.CreateProduct() method is often static — otherwise, the Client must instantiate a Factory first.'","source":"§5 / Lecture/W9/INF2001-W9_Design Patterns_preLEC.md:156-168","flag":false},{"id":36,"topic":"Design patterns","multi":false,"q":"The Observer pattern is which kind of pattern, and what relationship does it define?","options":[{"letter":"A","text":"Structural; a whole-part hierarchy of three or more levels"},{"letter":"B","text":"Behavioural; a one-to-many dependency where dependents are notified when state changes"},{"letter":"C","text":"Creational; a single shared instance of a class"},{"letter":"D","text":"Architectural; a distributed many-to-many messaging broker"}],"answer":"B","rationale":"Observer (behavioural): a class that generates events keeps a list of observers/listeners notified when an event arrives; this cohort's own WK10/WK11 work uses it.","source":"§5 / Lecture/W9/INF2001-W9_Design Patterns_preLEC.md:185-195; Lab/2500989_WK10_T03.md:10-19","flag":false},{"id":37,"topic":"Design patterns","multi":false,"q":"Which of these is NOT a creational design pattern?","options":[{"letter":"A","text":"Façade"},{"letter":"B","text":"Builder"},{"letter":"C","text":"Abstract Factory"},{"letter":"D","text":"Prototype"}],"answer":"A","rationale":"Creational = Factory, Abstract Factory, Builder, Prototype, Singleton. Façade is structural.","source":"§5 / Lecture/W9/CheatSheet_DesignPatterns.md:9-111","flag":false},{"id":38,"topic":"Design patterns","multi":false,"q":"A checkout module must create one of three payment classes, chosen at run time from a configuration value, and two more payment types are expected next quarter. Which pattern fits, and why?","options":[{"letter":"A","text":"Factory — it encapsulates the choice of concrete class behind a single creation point"},{"letter":"B","text":"Singleton — it guarantees only one payment object ever exists"},{"letter":"C","text":"Observer — the module is notified whenever a payment type is added"},{"letter":"D","text":"Composite — the payment types form a part-whole tree"}],"answer":"A","rationale":"Run-time choice of concrete type plus likely new subclasses is exactly Factory's applicability; the client calls one creation method instead of naming concrete classes.","source":"Brief §5, Factory","flag":false},{"id":39,"topic":"Design patterns","multi":false,"q":"Compared with an architectural pattern, a design pattern is:","options":[{"letter":"A","text":"A large-level tool concerned with global properties and system partitioning"},{"letter":"B","text":"A small-level tool concerned with schemes for refining and building smaller subsystems"},{"letter":"C","text":"Identical in scope but drawn with a different notation"},{"letter":"D","text":"Only applicable to distributed systems"}],"answer":"B","rationale":"Summary table: architecture = large-level tools (large-scale components, global properties, system partitioning, interfaces, scalability); design = small-level tools (refining/building smaller subsystems, software construction).","source":"§5 / Lecture/W9/INF2001-W9_Design Patterns_preLEC.md:205-232","flag":false},{"id":40,"topic":"Design patterns","multi":true,"q":"Which of these belong to the CREATIONAL group? (select all that apply)","options":[{"letter":"A","text":"Factory"},{"letter":"B","text":"Builder"},{"letter":"C","text":"Prototype"},{"letter":"D","text":"Singleton"},{"letter":"E","text":"Composite"},{"letter":"F","text":"Observer"}],"answer":["A","B","C","D"],"rationale":"Creational = Factory, Abstract Factory, Builder, Prototype, Singleton. Composite is structural; Observer is behavioural.","source":"§5 / Lecture/W9/CheatSheet_DesignPatterns.md:9-111","flag":false},{"id":41,"topic":"Testing","multi":false,"q":"Verification asks which question?","options":[{"letter":"A","text":"Are we building the right system?"},{"letter":"B","text":"Are we building the system right?"},{"letter":"C","text":"Is the system cheaper than the alternative?"},{"letter":"D","text":"Will the client accept the release?"}],"answer":"B","rationale":"Verification = 'the system right' (matches the specified requirements, well engineered, error-free); validation = 'the right system'.","source":"§6.1 / Lecture/W10/Introduction to Software Testing.md:61-88","flag":false},{"id":42,"topic":"Testing","multi":false,"q":"Validation is defined as checking whether:","options":[{"letter":"A","text":"The workflow was completed correctly"},{"letter":"B","text":"Every path of the code has been executed"},{"letter":"C","text":"The software has met the client's true needs and expectations"},{"letter":"D","text":"All unit tests pass with 100% statement coverage"}],"answer":"C","rationale":"Validation = whether the product as a whole satisfies its requirements / solves the original problem.","source":"§6.1 / Lecture/W10/Introduction to Software Testing.md:19-29","flag":false},{"id":43,"topic":"Testing","multi":false,"q":"Which is the lecture's 'leading principle' of software testing?","options":[{"letter":"A","text":"Testing is the last line of defence and can recover any defect"},{"letter":"B","text":"Every line of code must be executed at least once"},{"letter":"C","text":"Quality cannot be tested into the software"},{"letter":"D","text":"Testing should be done only by the developer who wrote the code"}],"answer":"C","rationale":"Leading principle slide: if it isn't built right in the first place it is never going to be right.","source":"§6.1 / Lecture/W10/Introduction to Software Testing.md:91-97","flag":false},{"id":44,"topic":"Testing","multi":false,"q":"Which of the following is a goal of software testing?","options":[{"letter":"A","text":"Prove the absence of all defects before release"},{"letter":"B","text":"Test every possible input combination"},{"letter":"C","text":"Minimise the time span between defect insertion, discovery and removal"},{"letter":"D","text":"Have each developer test their own module first"}],"answer":"C","rationale":"The three goals are minimise defects inserted, maximise defects found and removed, and minimise the time between insertion, discovery and removal — cost grows with delay. Exhaustive testing is explicitly impossible and developers should not test their own code.","source":"Brief §6, goals and principles","flag":false},{"id":45,"topic":"Testing","multi":false,"q":"Which is listed as a PRINCIPLE of testing?","options":[{"letter":"A","text":"We should not test our own code"},{"letter":"B","text":"Exhaustive testing is possible for small functions"},{"letter":"C","text":"Testing should wait until implementation is complete"},{"letter":"D","text":"Coverage of 80% is always sufficient"}],"answer":"A","rationale":"Three principles: exhaustive testing is not possible; provide the strongest guarantees at minimum effort/cost; we should not test our own code.","source":"§6.1 / Lecture/W10/Introduction to Software Testing.md:124-134","flag":false},{"id":46,"topic":"Testing","multi":false,"q":"A control-flow graph has 8 nodes and 10 edges. What is the cyclomatic complexity?","options":[{"letter":"A","text":"4"},{"letter":"B","text":"3"},{"letter":"C","text":"2"},{"letter":"D","text":"10"}],"answer":"A","rationale":"V(G) = E − N + 2 = 10 − 8 + 2 = 4; this is exactly the worked example in his own WK11 submission (3 decision nodes + 1 also gives 4).","source":"§6.3 / Lab/2500989_WK11_T03.md:88-99","flag":false},{"id":47,"topic":"Testing","multi":false,"q":"You are given the specification for a discount rule — 'orders over $100 get 10% off' — and no source code. Which deliverable can you produce from that alone?","options":[{"letter":"A","text":"A decision table with boundary-value test cases"},{"letter":"B","text":"A control-flow graph and its basis paths"},{"letter":"C","text":"Cyclomatic complexity and branch coverage"},{"letter":"D","text":"A code inspection checklist"}],"answer":"A","rationale":"With only the specification you are doing black-box testing: the deliverable is a decision table plus test cases, with boundaries at 100 and 101. Everything else needs the code.","source":"Brief §6.2, black-box vs white-box; §6.3 CFG needs code","flag":false},{"id":48,"topic":"Testing","multi":false,"q":"With V(G) = 4, how many independent basis paths must be tested?","options":[{"letter":"A","text":"4"},{"letter":"B","text":"3"},{"letter":"C","text":"1"},{"letter":"D","text":"8"}],"answer":"A","rationale":"V(G) equals the number of independent paths; his submission lists P1–P4, each adding at least one uncovered edge and together covering every node and branch.","source":"§6.3 / Lab/2500989_WK11_T03.md:100-117","flag":false},{"id":49,"topic":"Testing","multi":true,"q":"Which of these are verification techniques, as opposed to validation techniques? (select all that apply)","options":[{"letter":"A","text":"Style checkers"},{"letter":"B","text":"Static analysis"},{"letter":"C","text":"Code inspection"},{"letter":"D","text":"Model checking"},{"letter":"E","text":"Beta test"},{"letter":"F","text":"Customer acceptance test"}],"answer":["A","B","C","D"],"rationale":"The figure places style checkers, static analysis, proofs of correctness, robustness analysis, consistency checking, code inspection, model checking, model/specification inspection, prototyping and modelling under verification; beta test and customer acceptance test sit under validation.","source":"§6.1 / Lecture/W10/Introduction to Software Testing.md:137-179","flag":false},{"id":50,"topic":"Testing","multi":true,"q":"Which statements about software testing are correct? (select all that apply)","options":[{"letter":"A","text":"Verification determines whether the software was designed and developed as per the specified requirements"},{"letter":"B","text":"Validation checks whether the software has met the client's true needs and expectations"},{"letter":"C","text":"“Quality cannot be tested into the software” is given as the leading principle"},{"letter":"D","text":"Testing is an ongoing process from the start of development to release"},{"letter":"E","text":"Exhaustive testing is achievable on small systems"},{"letter":"F","text":"Developers should test their own code to save cost"}],"answer":["A","B","C","D"],"rationale":"Options 1–4 are verbatim from the deck. Exhaustive testing is explicitly stated as not possible, and “we should not test our own code” is one of the three principles.","source":"§6.1 / Lecture/W10/Introduction to Software Testing.md:19-38, 124-134","flag":false},{"id":51,"topic":"SCM","multi":false,"q":"What is the 'moving target' problem in software configuration management?","options":[{"letter":"A","text":"A change in the requirements while the software product is being developed"},{"letter":"B","text":"The compiled size of the product keeps growing"},{"letter":"C","text":"Moving code between development and production servers"},{"letter":"D","text":"Library versions silently upgrading during a build"}],"answer":"A","rationale":"Review slide at the start of the SCM deck defines the moving target problem exactly that way.","source":"§7 / Lecture/Software Configuration Management - Interactive Book Slides.md:19-23","flag":false},{"id":52,"topic":"SCM","multi":false,"q":"Which SCM activity covers assembling program components, data and libraries, and compiling?","options":[{"letter":"A","text":"Change control"},{"letter":"B","text":"Version management"},{"letter":"C","text":"Release management"},{"letter":"D","text":"System building"}],"answer":"D","rationale":"Four activities: change control (requests, cost/impact, decisions), version management (multiple versions, preventing interference), system building (assembling and compiling), release management (external release, released versions).","source":"§7 / Lecture/Software Configuration Management - Interactive Book Slides.md:137-174","flag":false},{"id":53,"topic":"SCM","multi":false,"q":"A configuration item is:","options":[{"letter":"A","text":"Any file that exists in the source repository"},{"letter":"B","text":"A personal IDE configuration file"},{"letter":"C","text":"The compiled executable shipped to the client"},{"letter":"D","text":"An approved and accepted deliverable associated with a software project, such as a design, code, test data or document"}],"answer":"D","rationale":"Definition slide; the CI list also covers requirements spec, design and implementation, test plan and harness, user documentation, system dependencies and tools.","source":"§7 / Lecture/Software Configuration Management - Interactive Book Slides.md:176-187","flag":false},{"id":54,"topic":"SCM","multi":false,"q":"Your team is deciding what belongs under version control for a game project. Which item should stay OUT of the repository?","options":[{"letter":"A","text":"The requirements specification"},{"letter":"B","text":"Compiled binaries such as .exe files"},{"letter":"C","text":"The test plan and harness"},{"letter":"D","text":"The user documentation"}],"answer":"B","rationale":"Track everything that is a deliverable and likely to change, but not compiled binaries, auto-generated files, personal config or large assets — they can be rebuilt or re-downloaded.","source":"Brief §7, configuration-item identification","flag":false},{"id":55,"topic":"SCM","multi":true,"q":"Which of these are the four activities of software configuration management? (select all that apply)","options":[{"letter":"A","text":"Change control"},{"letter":"B","text":"Version management"},{"letter":"C","text":"System building"},{"letter":"D","text":"Release management"},{"letter":"E","text":"Requirement elicitation"}],"answer":["A","B","C","D"],"rationale":"The SCM overview figure lists exactly these four; requirement elicitation is a requirements-engineering activity.","source":"§7 / Lecture/Software Configuration Management - Interactive Book Slides.md:137-174","flag":false},{"id":56,"topic":"Maintenance","multi":false,"q":"Software maintenance is defined (IEEE Std 1219-1998) as:","options":[{"letter":"A","text":"The process of fixing every defect found in testing"},{"letter":"B","text":"The activity of deploying releases to production"},{"letter":"C","text":"The rewriting of a product when its technology becomes obsolete"},{"letter":"D","text":"The modification of a software product after delivery to correct faults, to improve performance or other attributes"}],"answer":"D","rationale":"Definition slide, near-verbatim; the deck marks it IEEE std 1219-1998.","source":"§8 / Lecture/Introduction to Software Maintenance - Interactive Book Slides.md:42-53","flag":false},{"id":57,"topic":"Maintenance","multi":false,"q":"Roughly what share of total lifetime software cost goes to maintenance?","options":[{"letter":"A","text":"About one third"},{"letter":"B","text":"About two thirds"},{"letter":"C","text":"About half"},{"letter":"D","text":"About 90%"}],"answer":"B","rationale":"Maintenance 67%, integration 8%, testing 7%, design 6%, implementation 5%, analysis 5%, requirements 2%.","source":"§8 / Lecture/Introduction to Software Maintenance - Interactive Book Slides.md:55-71","flag":false},{"id":58,"topic":"Maintenance","multi":false,"q":"A new operating-system release forces a change to the product with no change to its basic functionality. This is:","options":[{"letter":"A","text":"Corrective maintenance"},{"letter":"B","text":"Perfective maintenance"},{"letter":"C","text":"Adaptive maintenance"},{"letter":"D","text":"Preventive maintenance"}],"answer":"C","rationale":"Adaptive = due to changes in the system's environment (new OS, new compiler, printer, electoral boundaries) with no major change to basic functionality.","source":"§8 / Lecture/Introduction to Software Maintenance - Interactive Book Slides.md:93-98","flag":false},{"id":59,"topic":"Maintenance","multi":false,"q":"Adding input validation, backup routines and exception handlers before any problem appears is:","options":[{"letter":"A","text":"Corrective maintenance"},{"letter":"B","text":"Adaptive maintenance"},{"letter":"C","text":"Preventive maintenance"},{"letter":"D","text":"Perfective maintenance"}],"answer":"C","rationale":"Preventive = prevent problems before they occur; examples: error checks/input validation, larger data structures, reduced complexity, patching vulnerabilities, exception handlers, backup routines.","source":"§8 / Lecture/Introduction to Software Maintenance - Interactive Book Slides.md:111-121","flag":false},{"id":60,"topic":"Maintenance","multi":true,"q":"Which of these changes are ADAPTIVE maintenance? (select all that apply)","options":[{"letter":"A","text":"Replacing the receipt printer with a new model that needs A7 paper instead of A6"},{"letter":"B","text":"Adding a faster search algorithm to the catalogue"},{"letter":"C","text":"Moving to a new OS release whose driver API changed"},{"letter":"D","text":"Fixing an off-by-one error in the invoice total"}],"answer":["A","C"],"rationale":"Adaptive maintenance responds to a changed environment with no change to basic functionality — new hardware model or new OS. A faster algorithm is perfective; an off-by-one is corrective.","source":"Brief §8, four maintenance types","flag":false}]},{"id":"inf2004","label":"INF2004 Quiz","short":"INF2004","sub":"Embedded Systems &middot; 16 Nov, both papers","questions":[{"id":1,"topic":"C semantics","bonus":false,"q":"In C, a condition is treated as true when the value is:","options":[{"letter":"A","text":"1 only"},{"letter":"B","text":"Any non-zero value"},{"letter":"C","text":"Any positive value"},{"letter":"D","text":"TRUE, if included"}],"answer":"B","rationale":"0 is false, everything else is true. Comparisons produce 1, but the test accepts any non-zero.","source":"INF2004 W1–W4 lecture","flag":false},{"id":2,"topic":"C semantics","bonus":false,"q":"What is the value of 17 && 23?","options":[{"letter":"A","text":"1"},{"letter":"B","text":"17"},{"letter":"C","text":"23"},{"letter":"D","text":"6"}],"answer":"A","rationale":"Logical AND tests truth: both are non-zero, so the result is 1. Bitwise 17 & 23 would be 17.","source":"INF2004 W1–W4 lecture","flag":false},{"id":3,"topic":"Toolchain","bonus":false,"q":"Which files are inputs when producing an object file?","options":[{"letter":"A","text":".c and .s"},{"letter":"B","text":".s and .o"},{"letter":"C","text":".o and .hex"},{"letter":"D","text":".c and .elf"}],"answer":"A","rationale":"The compiler turns .c into .s, the assembler turns .s into .o. Hex, bin and elf all appear after linking.","source":"INF2004 W1–W4 lecture","flag":false},{"id":4,"topic":"Toolchain","bonus":false,"q":"An error reading undefined reference to read_temp comes from:","options":[{"letter":"A","text":"the compiler"},{"letter":"B","text":"the assembler"},{"letter":"C","text":"the linker"},{"letter":"D","text":"the startup code"}],"answer":"C","rationale":"One file referenced it, no object or library defined it. Only the linker looks across files.","source":"INF2004 W1–W4 lecture","flag":false},{"id":5,"topic":"Toolchain","bonus":false,"q":"The main advantage of a low-level language is that it is:","options":[{"letter":"A","text":"portable"},{"letter":"B","text":"readable"},{"letter":"C","text":"compact and optimised"},{"letter":"D","text":"productive"}],"answer":"C","rationale":"Assembly is machine-dependent and hard to read, but it squeezes the hardware.","source":"INF2004 W1–W4 lecture","flag":false},{"id":6,"topic":"Memory & stack","bonus":false,"q":"The Stack Pointer holds:","options":[{"letter":"A","text":"the bottom of the stack"},{"letter":"B","text":"the end (top) of the stack"},{"letter":"C","text":"the size of the stack"},{"letter":"D","text":"the last value pushed"}],"answer":"B","rationale":"It marks the end of the stack, and the CPU maintains it on every call and return.","source":"INF2004 W1–W4 lecture","flag":false},{"id":7,"topic":"Memory & stack","bonus":false,"q":"Which instruction moves data onto the stack?","options":[{"letter":"A","text":"load"},{"letter":"B","text":"store"},{"letter":"C","text":"push"},{"letter":"D","text":"move"}],"answer":"C","rationale":"push puts data on, pop takes it off. load and store are register-to-memory, a different thing.","source":"INF2004 W1–W4 lecture","flag":false},{"id":8,"topic":"Memory & stack","bonus":false,"q":"The memory map tells the programmer:","options":[{"letter":"A","text":"how much RAM is free"},{"letter":"B","text":"the location of registers in memory"},{"letter":"C","text":"which tasks are running"},{"letter":"D","text":"the clock speed"}],"answer":"B","rationale":"Registers sit at fixed addresses; the map is how you know where.","source":"INF2004 W1–W4 lecture","flag":false},{"id":9,"topic":"GPIO","bonus":false,"q":"A GPIO output is best described as:","options":[{"letter":"A","text":"a power supply"},{"letter":"B","text":"a limited current source or sink"},{"letter":"C","text":"a floating input"},{"letter":"D","text":"an analogue output"}],"answer":"B","rationale":"A few milliamps. Motors and relays need a transistor or driver.","source":"INF2004 W1–W4 lecture","flag":false},{"id":10,"topic":"GPIO","bonus":false,"q":"An input with nothing driving it reads randomly because:","options":[{"letter":"A","text":"it is broken"},{"letter":"B","text":"it floats with no defined level"},{"letter":"C","text":"it is configured as output"},{"letter":"D","text":"the pull-down is too strong"}],"answer":"B","rationale":"Undriven means undefined. A pull-up or pull-down holds a known level.","source":"INF2004 W1–W4 lecture","flag":false},{"id":11,"topic":"GPIO","bonus":false,"q":"A pull-up resistor with a switch to ground gives:","options":[{"letter":"A","text":"rest LOW, pressed HIGH"},{"letter":"B","text":"rest HIGH, pressed LOW"},{"letter":"C","text":"HIGH in both states"},{"letter":"D","text":"LOW in both states"}],"answer":"B","rationale":"Active-low: the resistor holds it high, the switch pulls it to ground.","source":"INF2004 W1–W4 lecture","flag":false},{"id":12,"topic":"Interrupts","bonus":false,"q":"An ISR can start only when it is:","options":[{"letter":"A","text":"enabled, pending and higher priority"},{"letter":"B","text":"enabled and pending only"},{"letter":"C","text":"pending and unmasked only"},{"letter":"D","text":"enabled and periodic"}],"answer":"A","rationale":"All three gates. Priority is what allows nesting.","source":"INF2004 W1–W4 lecture","flag":false},{"id":13,"topic":"Interrupts","bonus":false,"q":"An ISR should always, before returning:","options":[{"letter":"A","text":"log the event"},{"letter":"B","text":"clear the interrupt flag"},{"letter":"C","text":"free its memory"},{"letter":"D","text":"switch tasks"}],"answer":"B","rationale":"Leave the flag set and the same interrupt fires again immediately, starving main code.","source":"INF2004 W1–W4 lecture","flag":false},{"id":14,"topic":"Interrupts","bonus":false,"q":"Are interrupts easy to debug?","options":[{"letter":"A","text":"Yes, they are deterministic"},{"letter":"B","text":"Yes, they run in order"},{"letter":"C","text":"No, they are asynchronous and timing-dependent"},{"letter":"D","text":"Yes, if the ISR is short"}],"answer":"C","rationale":"The bug depends on timing that cannot be reproduced on demand.","source":"INF2004 W1–W4 lecture","flag":false},{"id":15,"topic":"Timers","bonus":false,"q":"A 125 MHz clock with a prescaler of 250 gives a tick every:","options":[{"letter":"A","text":"2 ms"},{"letter":"B","text":"20 µs"},{"letter":"C","text":"2 µs"},{"letter":"D","text":"500 µs"}],"answer":"C","rationale":"125 MHz ÷ 250 = 500 kHz, so 1 ÷ 500,000 = 2 µs.","source":"INF2004 W1–W4 lecture","flag":false},{"id":16,"topic":"Timers","bonus":false,"q":"A PWM signal is high for 333 ms at a 40% duty cycle. The period is:","options":[{"letter":"A","text":"133 ms"},{"letter":"B","text":"832.5 ms"},{"letter":"C","text":"1.2 s"},{"letter":"D","text":"555 ms"}],"answer":"B","rationale":"duty = high ÷ period, so period = 333 ÷ 0.40 = 832.5 ms.","source":"INF2004 W1–W4 lecture","flag":false},{"id":17,"topic":"Comms","bonus":false,"q":"A single parity bit detects:","options":[{"letter":"A","text":"all errors"},{"letter":"B","text":"an odd number of bit errors"},{"letter":"C","text":"an even number of bit errors"},{"letter":"D","text":"and corrects one error"}],"answer":"B","rationale":"Two flipped bits cancel out. Parity detects, never corrects.","source":"INF2004 W1–W4 lecture","flag":false},{"id":18,"topic":"ADC","bonus":false,"q":"A transducer:","options":[{"letter":"A","text":"always converts analogue to digital"},{"letter":"B","text":"converts one form of signal into another"},{"letter":"C","text":"only works with an ADC"},{"letter":"D","text":"measures current"}],"answer":"B","rationale":"A speaker and a thermistor are transducers too.","source":"INF2004 W1–W4 lecture","flag":false},{"id":19,"topic":"ADC","bonus":false,"q":"A 12-bit ADC divides the range into:","options":[{"letter":"A","text":"1024 steps"},{"letter":"B","text":"2048 steps"},{"letter":"C","text":"4096 steps"},{"letter":"D","text":"512 steps"}],"answer":"C","rationale":"2 to the power 12 = 4096.","source":"INF2004 W1–W4 lecture","flag":false},{"id":20,"topic":"RTOS","bonus":false,"q":"The structure that represents a task is the:","options":[{"letter":"A","text":"scheduler"},{"letter":"B","text":"TCB"},{"letter":"C","text":"queue"},{"letter":"D","text":"pool"}],"answer":"B","rationale":"The TCB holds its stack pointer, priority and state. The scheduler does the deciding.","source":"INF2004 W1–W4 lecture","flag":false},{"id":21,"topic":"RTOS","bonus":false,"q":"Which is NOT a characteristic of an RTOS?","options":[{"letter":"A","text":"Deterministic response"},{"letter":"B","text":"Minimal interrupt latency"},{"letter":"C","text":"High throughput for batch processing"},{"letter":"D","text":"Priority-based scheduling"}],"answer":"C","rationale":"That is a desktop OS goal, and the opposite of the RTOS trade.","source":"INF2004 W1–W4 lecture","flag":false},{"id":22,"topic":"Scheduling","bonus":false,"q":"EDF and LST are:","options":[{"letter":"A","text":"fixed priority"},{"letter":"B","text":"dynamic priority"},{"letter":"C","text":"round robin"},{"letter":"D","text":"rate monotonic"}],"answer":"B","rationale":"Dynamic = EDF and LST. Fixed = RMS and DMS.","source":"INF2004 W1–W4 lecture","flag":false},{"id":23,"topic":"Scheduling","bonus":false,"q":"RMS gives highest priority to the task with the:","options":[{"letter":"A","text":"longest period"},{"letter":"B","text":"shortest period"},{"letter":"C","text":"nearest deadline"},{"letter":"D","text":"least slack"}],"answer":"B","rationale":"Rate monotonic ranks by period; deadline monotonic ranks by deadline.","source":"INF2004 W1–W4 lecture","flag":false},{"id":24,"topic":"Shared data","bonus":false,"q":"A mutex differs from a semaphore because it:","options":[{"letter":"A","text":"has an owner"},{"letter":"B","text":"has a count"},{"letter":"C","text":"can be given by anyone"},{"letter":"D","text":"never blocks"}],"answer":"A","rationale":"Only the owning task may unlock it. A semaphore is a signal or count with no owner.","source":"INF2004 W1–W4 lecture","flag":false},{"id":25,"topic":"State machines","bonus":false,"q":"A guard is:","options":[{"letter":"A","text":"the action taken on a transition"},{"letter":"B","text":"the condition that must be true for a transition"},{"letter":"C","text":"the current state"},{"letter":"D","text":"the event that triggered the transition"}],"answer":"B","rationale":"It decides whether the transition is permitted at all.","source":"INF2004 W1–W4 lecture","flag":false},{"id":26,"topic":"State machines","bonus":false,"q":"A state machine should be driven by:","options":[{"letter":"A","text":"one task per state"},{"letter":"B","text":"the ISR directly"},{"letter":"C","text":"one owning task receiving events from a queue"},{"letter":"D","text":"the main loop polling flags"}],"answer":"C","rationale":"Events are queued, then dispatched exactly once by the owning task.","source":"INF2004 W1–W4 lecture","flag":false},{"id":27,"topic":"Comms","bonus":false,"q":"100 characters per second at 10 bits per character is:","options":[{"letter":"A","text":"100 baud"},{"letter":"B","text":"1000 baud"},{"letter":"C","text":"10 000 baud"},{"letter":"D","text":"100 bits per second"}],"answer":"B","rationale":"8 data bits plus start and stop. 100 × 10 = 1000.","source":"INF2004 W1–W4 lecture","flag":false},{"id":28,"topic":"Shared data","bonus":false,"q":"volatile tells the compiler that:","options":[{"letter":"A","text":"the variable is thread-safe"},{"letter":"B","text":"the value may change outside the code's control"},{"letter":"C","text":"the variable is constant"},{"letter":"D","text":"the variable lives in flash"}],"answer":"B","rationale":"It forces a re-read from memory. It does not lock anything.","source":"INF2004 W1–W4 lecture","flag":false},{"id":29,"topic":"Code reading","bonus":false,"q":"What is the main problem with this code?","code":"This runs on every timer interrupt.\n\nvoid on_timer(void) {\n    ticks++;\n}","options":[{"letter":"A","text":"The counter overflows"},{"letter":"B","text":"The interrupt flag is never cleared, so the ISR re-enters immediately"},{"letter":"C","text":"The variable must be const"},{"letter":"D","text":"The ISR returns the wrong value"}],"answer":"B","rationale":"Every ISR must clear the flag it is servicing before returning, or the peripheral stays pending and the CPU never gets back to main.","source":"INF2004 lab / project code","flag":false},{"id":30,"topic":"Code reading","bonus":false,"q":"What is the main problem with this code?","code":"int count = 0;\n\nvoid taskA(void) { count++; }\nvoid taskB(void) { count++; }","options":[{"letter":"A","text":"Nothing, both increments are safe"},{"letter":"B","text":"A race condition: read-add-write can interleave and lose an increment"},{"letter":"C","text":"The counter will overflow"},{"letter":"D","text":"count must be const"}],"answer":"B","rationale":"count++ is three instructions. A context switch between them loses an update. Guard it with a mutex or a critical section.","source":"INF2004 lab / project code","flag":false},{"id":31,"topic":"Code reading","bonus":false,"q":"What is the main problem with this code?","code":"int ready = 0;\n\nvoid isr(void) { ready = 1; }\n\nint main(void) {\n    while (!ready) { }\n    start();\n}","options":[{"letter":"A","text":"It works"},{"letter":"B","text":"The compiler may cache ready in a register and loop forever"},{"letter":"C","text":"ready needs a pull-up"},{"letter":"D","text":"The ISR runs too often"}],"answer":"B","rationale":"The compiler cannot see the ISR changing it, so it hoists the read. Declare it volatile.","source":"INF2004 lab / project code","flag":false},{"id":32,"topic":"Code reading","bonus":false,"q":"What is the main problem with this code?","code":"void uart_isr(void) {\n    char c = uart_get();\n    printf(\"%c\", c);\n}","options":[{"letter":"A","text":"printf is fine here"},{"letter":"B","text":"printf is slow and may block, stalling every other interrupt"},{"letter":"C","text":"printf needs a mutex"},{"letter":"D","text":"printf will print twice"}],"answer":"B","rationale":"Milliseconds inside an ISR. Queue the byte and let a task print it.","source":"INF2004 lab / project code","flag":false},{"id":33,"topic":"Code reading","bonus":false,"q":"What is the main problem with this code?","code":"gpio_init(5);\ngpio_set_dir(5, GPIO_OUT);\ngpio_put(5, 1);   // 12 V motor connected directly","options":[{"letter":"A","text":"Works if the motor is small"},{"letter":"B","text":"The pin cannot supply the motor current"},{"letter":"C","text":"The pin needs a pull-up"},{"letter":"D","text":"The motor will run backwards"}],"answer":"B","rationale":"A GPIO sources a few milliamps. Use a transistor or driver and a separate supply.","source":"INF2004 lab / project code","flag":false},{"id":34,"topic":"Code reading","bonus":false,"q":"What is the main problem with this code?","code":"Device A: TX to pin 1, RX to pin 2.\nDevice B: TX to pin 1, RX to pin 2.\n(1 and 2 are wired straight across)","options":[{"letter":"A","text":"Nothing arrives because TX must cross to RX"},{"letter":"B","text":"It works at half speed"},{"letter":"C","text":"Both devices transmit twice"},{"letter":"D","text":"Parity will catch it"}],"answer":"A","rationale":"TX of one side goes to RX of the other. Straight-through wiring gives silence.","source":"INF2004 lab / project code","flag":false},{"id":35,"topic":"Code reading","bonus":false,"q":"What is the main problem with this code?","code":"void taskA(void) { lock(m1); lock(m2); ... }\nvoid taskB(void) { lock(m2); lock(m1); ... }","options":[{"letter":"A","text":"Priority inversion"},{"letter":"B","text":"Deadlock if both run concurrently"},{"letter":"C","text":"A race on m1"},{"letter":"D","text":"m2 is redundant"}],"answer":"B","rationale":"Each holds what the other wants. Always take multiple locks in the same order.","source":"INF2004 lab / project code","flag":false},{"id":36,"topic":"Code reading","bonus":false,"q":"What is the main problem with this code?","code":"void button_isr(void) {\n    fsm_step(&fsm, EV_PRESS);\n}","options":[{"letter":"A","text":"It is correct"},{"letter":"B","text":"The machine should be stepped by a task, with the ISR only posting the event"},{"letter":"C","text":"fsm must be volatile"},{"letter":"D","text":"fsm_step must be inline"}],"answer":"B","rationale":"Work in the ISR freezes everything else. Post to a queue; one owning task dispatches events exactly once.","source":"INF2004 lab / project code","flag":false}]},{"id":"inf2004gpio","label":"INF2004 GPIO drill","short":"GPIO drill","sub":"Electrical reality &middot; active-low, pull resistors, current","questions":[{"id":1,"topic":"GPIO","bonus":false,"q":"A 3.3 V microcontroller's GPIO pin can typically source or sink about:","options":[{"letter":"A","text":"4–8 mA"},{"letter":"B","text":"500 mA"},{"letter":"C","text":"1 A"},{"letter":"D","text":"Whatever the supply provides"}],"answer":"A","rationale":"A few milliamps. That is why motors, relays and bright LEDs need a driver.","source":"GPIO & electrical","flag":false},{"id":2,"topic":"GPIO","bonus":false,"q":"Why can a GPIO pin not drive a 12 V motor directly?","options":[{"letter":"A","text":"The pin's voltage and current are both far too small"},{"letter":"B","text":"The pin is always input by default"},{"letter":"C","text":"Motors require PWM only"},{"letter":"D","text":"The pin has no pull-up"}],"answer":"A","rationale":"3.3 V cannot supply 12 V, and the pin's current limit is milliamps. Use a transistor or driver and a separate supply.","source":"GPIO & electrical","flag":false},{"id":3,"topic":"GPIO","bonus":false,"q":"The job of a pull-up resistor is to:","options":[{"letter":"A","text":"Increase the pin's output current"},{"letter":"B","text":"Hold the pin at a known logic level when nothing drives it"},{"letter":"C","text":"Protect against over-voltage"},{"letter":"D","text":"Convert analogue to digital"}],"answer":"B","rationale":"It stops the pin floating, so the idle state is defined.","source":"GPIO & electrical","flag":false},{"id":4,"topic":"GPIO","bonus":false,"q":"Pull-up resistor, switch to ground. At rest and when pressed the pin reads:","options":[{"letter":"A","text":"Rest 1, pressed 0"},{"letter":"B","text":"Rest 0, pressed 1"},{"letter":"C","text":"1 in both states"},{"letter":"D","text":"0 in both states"}],"answer":"A","rationale":"Active-low. The resistor holds it high, the switch pulls it to ground.","source":"GPIO & electrical","flag":false},{"id":5,"topic":"GPIO","bonus":false,"q":"Pull-down resistor, switch to 3.3 V. At rest and when pressed the pin reads:","options":[{"letter":"A","text":"Rest 1, pressed 0"},{"letter":"B","text":"Rest 0, pressed 1"},{"letter":"C","text":"1 in both states"},{"letter":"D","text":"0 in both states"}],"answer":"B","rationale":"Active-high: the pull-down holds it low, the switch raises it.","source":"GPIO & electrical","flag":false},{"id":6,"topic":"GPIO","bonus":false,"q":"Pull-up resistor with the switch wired to 3.3 V. The pin reads:","options":[{"letter":"A","text":"Rest 1, pressed 0"},{"letter":"B","text":"Rest 0, pressed 1"},{"letter":"C","text":"1 in both states"},{"letter":"D","text":"Random"}],"answer":"C","rationale":"Both paths pull to the same rail, so pressing changes nothing. Always 1.","source":"GPIO & electrical","flag":false},{"id":7,"topic":"GPIO","bonus":false,"q":"An input pin with no pull resistor and nothing connected will:","options":[{"letter":"A","text":"Read 0 reliably"},{"letter":"B","text":"Read 1 reliably"},{"letter":"C","text":"Read an undefined level that changes with noise"},{"letter":"D","text":"Damage the chip"}],"answer":"C","rationale":"It floats. Undriven inputs pick up whatever is nearby.","source":"GPIO & electrical","flag":false},{"id":8,"topic":"GPIO","bonus":false,"q":"Two modules each configure the same pin for different purposes. The result is:","options":[{"letter":"A","text":"A compile error"},{"letter":"B","text":"The last configuration wins and the other module misbehaves"},{"letter":"C","text":"Both work simultaneously"},{"letter":"D","text":"The pin is disabled"}],"answer":"B","rationale":"One owner per pin. Silent breakage, hard to trace.","source":"GPIO & electrical","flag":false},{"id":9,"topic":"GPIO","bonus":false,"q":"A 5 V sensor output is wired straight into a 3.3 V MCU input. The risk is:","options":[{"letter":"A","text":"Nothing, inputs accept any voltage"},{"letter":"B","text":"Over-voltage damage to the input; use a level shifter or divider"},{"letter":"C","text":"The reading will be inverted"},{"letter":"D","text":"The pin will float"}],"answer":"B","rationale":"Inputs are not tolerant of arbitrary voltage. Shift the level.","source":"GPIO & electrical","flag":false},{"id":10,"topic":"GPIO","bonus":false,"q":"Code sets the pin as an input, then calls gpio_put(pin, 1) expecting a high output. What happens?","options":[{"letter":"A","text":"The pin goes high"},{"letter":"B","text":"Nothing: an input cannot be driven by the pin, so the level is set by the circuit"},{"letter":"C","text":"The chip resets"},{"letter":"D","text":"The pin toggles"}],"answer":"B","rationale":"Direction must be output before the pin can drive a level.","source":"GPIO & electrical","flag":false},{"id":11,"topic":"GPIO","bonus":false,"q":"An \"active-low\" signal is asserted when it is:","options":[{"letter":"A","text":"HIGH"},{"letter":"B","text":"LOW"},{"letter":"C","text":"Floating"},{"letter":"D","text":"Pulsing"}],"answer":"B","rationale":"Active-low means the meaningful state is the low level, which is why pull-up circuits test for 0.","source":"GPIO & electrical","flag":false},{"id":12,"topic":"GPIO","bonus":false,"q":"In the snippet, when does \"pressed\" print?","options":[{"letter":"A","text":"Only while the button is held"},{"letter":"B","text":"All the time except while the button is held"},{"letter":"C","text":"Never"},{"letter":"D","text":"Randomly"}],"answer":"B","rationale":"Pull-up holds the pin at 1, so ==1 is true whenever the button is untouched. Test for 0 instead.","source":"GPIO & electrical","flag":false,"code":"gpio_pull_up(15);\n// switch wired to GND\n\nif (gpio_get(15) == 1)\n    printf(\"pressed\\n\");"},{"id":13,"topic":"GPIO","bonus":false,"q":"In the same snippet, the minimal fix is:","options":[{"letter":"A","text":"Change to gpio_pull_down(15)"},{"letter":"B","text":"Test for 0 instead of 1"},{"letter":"C","text":"Move the switch to 3.3 V"},{"letter":"D","text":"Add a delay"}],"answer":"B","rationale":"With a pull-up and switch to ground, pressed is LOW, so the condition must check for 0.","source":"GPIO & electrical","flag":false},{"id":14,"topic":"Comms","bonus":false,"q":"A single parity bit fails to detect:","options":[{"letter":"A","text":"One flipped bit"},{"letter":"B","text":"Three flipped bits"},{"letter":"C","text":"Five flipped bits"},{"letter":"D","text":"An even number of flipped bits"}],"answer":"D","rationale":"Even counts cancel out and pass undetected.","source":"GPIO & electrical","flag":false},{"id":15,"topic":"C semantics","bonus":false,"q":"What is the value of 17 && 23?","options":[{"letter":"A","text":"1"},{"letter":"B","text":"17"},{"letter":"C","text":"23"},{"letter":"D","text":"6"}],"answer":"A","rationale":"Logical AND: both operands are non-zero, so the result is 1.","source":"GPIO & electrical","flag":false}]},{"id":"ict2212q2","label":"ICT2212 Quiz 2","short":"ICT2212 Q2","sub":"Ethical Hacking &middot; Weeks 8&ndash;11","questions":[{"id":1,"topic":"Web basics","bonus":false,"q":"Which tool fingerprints the technologies a website runs (server, CMS, frameworks)?","options":[{"letter":"A","text":"whatweb"},{"letter":"B","text":"dig"},{"letter":"C","text":"wafw00f"},{"letter":"D","text":"sqlmap"}],"answer":"A","rationale":"whatweb reports technologies in use; dig is DNS, wafw00f detects a WAF.","source":"ICT2212 Wk 8-11","flag":false},{"id":2,"topic":"Web basics","bonus":false,"q":"A site lists 'Disallow: /admin/' in robots.txt. What does that give an attacker?","options":[{"letter":"A","text":"Protection, because crawlers obey it"},{"letter":"B","text":"A hint about where interesting paths are"},{"letter":"C","text":"A list of valid credentials"},{"letter":"D","text":"Nothing, the file is encrypted"}],"answer":"B","rationale":"robots.txt is an instruction to crawlers, publicly readable, and effectively a map of sensitive paths.","source":"ICT2212 Wk 8-11","flag":false},{"id":3,"topic":"Web basics","bonus":false,"q":"Burp Suite's core value in a web test is that it:","options":[{"letter":"A","text":"Scans for SQL errors automatically"},{"letter":"B","text":"Sits between browser and server so requests can be intercepted and modified"},{"letter":"C","text":"Encrypts traffic"},{"letter":"D","text":"Blocks XSS"}],"answer":"B","rationale":"Interception lets the tester change anything the browser enforced, like hidden fields or disabled buttons.","source":"ICT2212 Wk 8-11","flag":false},{"id":4,"topic":"Web basics","bonus":false,"q":"Client-side validation protects the server because:","options":[{"letter":"A","text":"It blocks malformed input before sending"},{"letter":"B","text":"It does not: any request can be sent directly"},{"letter":"C","text":"Browsers refuse to send invalid forms"},{"letter":"D","text":"It encrypts the fields"}],"answer":"B","rationale":"The attacker controls the client. Only server-side checks count.","source":"ICT2212 Wk 8-11","flag":false},{"id":5,"topic":"Web basics","bonus":false,"q":"Which HTTP status code means 'not found'?","options":[{"letter":"A","text":"200"},{"letter":"B","text":"301"},{"letter":"C","text":"404"},{"letter":"D","text":"500"}],"answer":"C","rationale":"404 is not found; 500 is a server error, 301 a redirect.","source":"ICT2212 Wk 8-11","flag":false},{"id":6,"topic":"Web basics","bonus":false,"q":"Reading the 'Server' response header tells you:","options":[{"letter":"A","text":"The victim's IP"},{"letter":"B","text":"The web server software and often its version"},{"letter":"C","text":"The database password"},{"letter":"D","text":"The session token"}],"answer":"B","rationale":"Version disclosure is a classic information leak that maps to known exploits.","source":"ICT2212 Wk 8-11","flag":false},{"id":7,"topic":"SQL injection","bonus":false,"q":"In `admin' OR 1=1 --`, what does the `--` do?","options":[{"letter":"A","text":"Starts a comment, removing the rest of the query"},{"letter":"B","text":"Escapes the quote"},{"letter":"C","text":"Ends the statement early"},{"letter":"D","text":"Adds a second query"}],"answer":"A","rationale":"It comments out the remaining clause, usually the password check.","source":"ICT2212 Wk 8-11","flag":false},{"id":8,"topic":"SQL injection","bonus":false,"q":"Why does a login form become vulnerable to SQL injection?","options":[{"letter":"A","text":"Passwords are stored in plain text"},{"letter":"B","text":"User input is concatenated into the SQL string"},{"letter":"C","text":"The form uses POST"},{"letter":"D","text":"Cookies are enabled"}],"answer":"B","rationale":"Input becomes part of the command instead of a value.","source":"ICT2212 Wk 8-11","flag":false},{"id":9,"topic":"SQL injection","bonus":false,"q":"`ORDER BY 12` returns an error. What have you learned?","options":[{"letter":"A","text":"The table has 12 columns"},{"letter":"B","text":"The query returns 11 columns"},{"letter":"C","text":"The database is MySQL"},{"letter":"D","text":"Injection is impossible"}],"answer":"B","rationale":"Sorting by a non-existent column errors; so 11 columns exist.","source":"ICT2212 Wk 8-11","flag":false},{"id":10,"topic":"SQL injection","bonus":false,"q":"Why do you need the column count before using UNION SELECT?","options":[{"letter":"A","text":"To sort results"},{"letter":"B","text":"UNION requires both queries to return the same number of columns"},{"letter":"C","text":"To bypass the WAF"},{"letter":"D","text":"To encrypt the payload"}],"answer":"B","rationale":"Mismatched counts error out, so the count tells you how many placeholders to include.","source":"ICT2212 Wk 8-11","flag":false},{"id":11,"topic":"SQL injection","bonus":false,"q":"The most effective defence against SQL injection is:","options":[{"letter":"A","text":"Escaping quotes"},{"letter":"B","text":"Parameterised queries (prepared statements)"},{"letter":"C","text":"Hiding error messages"},{"letter":"D","text":"A WAF"}],"answer":"B","rationale":"Prepared statements compile the query first, so input is data and can never change the structure.","source":"ICT2212 Wk 8-11","flag":false},{"id":12,"topic":"SQL injection","bonus":false,"q":"Blind SQL injection is used when:","options":[{"letter":"A","text":"The query result is not shown on the page"},{"letter":"B","text":"The database is offline"},{"letter":"C","text":"There is no login form"},{"letter":"D","text":"The site uses HTTPS"}],"answer":"A","rationale":"With no visible output the attacker infers data from true/false responses or response delays.","source":"ICT2212 Wk 8-11","flag":false},{"id":13,"topic":"SQL injection","bonus":false,"q":"Which system table holds the names of tables and columns in MySQL?","options":[{"letter":"A","text":"mysql.user"},{"letter":"B","text":"information_schema"},{"letter":"C","text":"sys.log"},{"letter":"D","text":"performance_schema"}],"answer":"B","rationale":"information_schema exposes schema metadata, which is why attackers enumerate it first.","source":"ICT2212 Wk 8-11","flag":false},{"id":14,"topic":"SQL injection","bonus":false,"q":"In MySQL, which character also comments out the rest of a query?","options":[{"letter":"A","text":";"},{"letter":"B","text":"#"},{"letter":"C","text":"$"},{"letter":"D","text":"@"}],"answer":"B","rationale":"# works like -- in MySQL.","source":"ICT2212 Wk 8-11","flag":false},{"id":15,"topic":"SQL injection","bonus":false,"q":"A page shows all tickets after entering `1' OR '1'='1`. What happened?","options":[{"letter":"A","text":"XSS"},{"letter":"B","text":"The WHERE clause became always true, returning every row"},{"letter":"C","text":"The database crashed"},{"letter":"D","text":"The input was escaped"}],"answer":"B","rationale":"The injected OR makes the condition true for all rows, leaking the whole table.","source":"ICT2212 Wk 8-11","flag":false},{"id":16,"topic":"XSS","bonus":false,"q":"The three XSS types differ mainly by:","options":[{"letter":"A","text":"The script language used"},{"letter":"B","text":"Where the payload lives (stored, reflected, DOM)"},{"letter":"C","text":"The browser version"},{"letter":"D","text":"The encoding used"}],"answer":"B","rationale":"Persistent is stored server-side, reflected comes back in the response, DOM-based never reaches the server.","source":"ICT2212 Wk 8-11","flag":false},{"id":17,"topic":"XSS","bonus":false,"q":"Which XSS type never reaches the server at all?","options":[{"letter":"A","text":"Persistent"},{"letter":"B","text":"Reflected"},{"letter":"C","text":"DOM-based"},{"letter":"D","text":"Stored"}],"answer":"C","rationale":"Client-side JavaScript reads the payload from the URL and writes it into the page.","source":"ICT2212 Wk 8-11","flag":false},{"id":18,"topic":"XSS","bonus":false,"q":"An attacker's JavaScript running via XSS executes:","options":[{"letter":"A","text":"On the server"},{"letter":"B","text":"In the victim's browser, in the vulnerable site's context"},{"letter":"C","text":"In the database"},{"letter":"D","text":"In the firewall"}],"answer":"B","rationale":"That is why the target is the victim's session, not the server's data.","source":"ICT2212 Wk 8-11","flag":false},{"id":19,"topic":"XSS","bonus":false,"q":"The primary defence against XSS is:","options":[{"letter":"A","text":"Input length limits"},{"letter":"B","text":"Output encoding for the context"},{"letter":"C","text":"HTTPS"},{"letter":"D","text":"A WAF"}],"answer":"B","rationale":"Rendering user input as text rather than code removes the execution path.","source":"ICT2212 Wk 8-11","flag":false},{"id":20,"topic":"XSS","bonus":false,"q":"HttpOnly on a session cookie:","options":[{"letter":"A","text":"Prevents XSS entirely"},{"letter":"B","text":"Stops JavaScript reading the cookie"},{"letter":"C","text":"Stops the browser sending the cookie"},{"letter":"D","text":"Encrypts the cookie"}],"answer":"B","rationale":"It limits damage by blocking cookie theft, but the script still runs.","source":"ICT2212 Wk 8-11","flag":false},{"id":21,"topic":"XSS","bonus":false,"q":"A comment box stores a <script> tag in the database and every visitor runs it. Which type of XSS is this?","options":[{"letter":"A","text":"Reflected"},{"letter":"B","text":"Persistent"},{"letter":"C","text":"DOM-based"},{"letter":"D","text":"CSRF"}],"answer":"B","rationale":"The payload is stored server-side and served to all visitors.","source":"ICT2212 Wk 8-11","flag":false},{"id":22,"topic":"XSS","bonus":false,"q":"What does SQLi target compared with XSS?","options":[{"letter":"A","text":"SQLi targets the database; XSS targets the victim's browser"},{"letter":"B","text":"Both target the database"},{"letter":"C","text":"SQLi targets the browser"},{"letter":"D","text":"Both target the web server process"}],"answer":"A","rationale":"Different execution context, different asset at risk.","source":"ICT2212 Wk 8-11","flag":false},{"id":23,"topic":"XSS","bonus":false,"q":"A Content Security Policy helps by:","options":[{"letter":"A","text":"Encrypting cookies"},{"letter":"B","text":"Restricting which sources of script may run"},{"letter":"C","text":"Blocking SQL keywords"},{"letter":"D","text":"Hiding server versions"}],"answer":"B","rationale":"CSP limits where scripts can load from, reducing the impact if i
