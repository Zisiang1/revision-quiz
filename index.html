njection occurs.","source":"ICT2212 Wk 8-11","flag":false},{"id":24,"topic":"CSRF","bonus":false,"q":"CSRF works because:","options":[{"letter":"A","text":"The browser automatically attaches the victim's cookies to requests for that site"},{"letter":"B","text":"The attacker knows the password"},{"letter":"C","text":"JavaScript can read cross-site responses"},{"letter":"D","text":"Cookies are encrypted"}],"answer":"A","rationale":"Ambient authentication: the server trusts any request carrying a valid session.","source":"ICT2212 Wk 8-11","flag":false},{"id":25,"topic":"CSRF","bonus":false,"q":"After a CSRF attack, can the attacker read the response?","options":[{"letter":"A","text":"Yes, always"},{"letter":"B","text":"No, the same-origin policy blocks reading cross-site responses"},{"letter":"C","text":"Only over HTTPS"},{"letter":"D","text":"Only if cookies are HttpOnly"}],"answer":"B","rationale":"CSRF performs blind actions; data theft requires XSS.","source":"ICT2212 Wk 8-11","flag":false},{"id":26,"topic":"CSRF","bonus":false,"q":"The main defence against CSRF is:","options":[{"letter":"A","text":"HttpOnly cookies"},{"letter":"B","text":"A per-session CSRF token embedded in forms"},{"letter":"C","text":"Encrypting the session"},{"letter":"D","text":"Using GET"}],"answer":"B","rationale":"The attacker cannot guess or read the token, so the forged request is rejected.","source":"ICT2212 Wk 8-11","flag":false},{"id":27,"topic":"CSRF","bonus":false,"q":"Setting SameSite=Lax on the session cookie:","options":[{"letter":"A","text":"Blocks the cookie on cross-site requests"},{"letter":"B","text":"Makes it readable by JavaScript"},{"letter":"C","text":"Encrypts the cookie"},{"letter":"D","text":"Prevents SQL injection"}],"answer":"A","rationale":"Cross-site requests arrive without the session, so they are unauthenticated.","source":"ICT2212 Wk 8-11","flag":false},{"id":28,"topic":"CSRF","bonus":false,"q":"Why is a state-changing GET request dangerous?","options":[{"letter":"A","text":"It is cached"},{"letter":"B","text":"It can be triggered by an image tag or link with no form"},{"letter":"C","text":"It cannot use cookies"},{"letter":"D","text":"It breaks the database"}],"answer":"B","rationale":"`<img src='...'>` fires the request automatically, which is why state changes should use POST plus a token.","source":"ICT2212 Wk 8-11","flag":false},{"id":29,"topic":"Memory bugs","bonus":false,"q":"A stack buffer overflow overwrites the saved return address, which lets the attacker:","options":[{"letter":"A","text":"Read the source code"},{"letter":"B","text":"Redirect execution to code of their choosing"},{"letter":"C","text":"Encrypt the stack"},{"letter":"D","text":"Change the CPU clock"}],"answer":"B","rationale":"Controlling the return address means controlling where the CPU jumps next.","source":"ICT2212 Wk 8-11","flag":false},{"id":30,"topic":"Memory bugs","bonus":false,"q":"A stack canary works by:","options":[{"letter":"A","text":"Encrypting the stack"},{"letter":"B","text":"Placing a secret value before the return address and checking it on return"},{"letter":"C","text":"Randomising addresses"},{"letter":"D","text":"Blocking strcpy at compile time"}],"answer":"B","rationale":"If the canary changed, the overflow happened and the program aborts.","source":"ICT2212 Wk 8-11","flag":false},{"id":31,"topic":"Memory bugs","bonus":false,"q":"ASLR defends by:","options":[{"letter":"A","text":"Randomising memory addresses each run"},{"letter":"B","text":"Marking the stack non-executable"},{"letter":"C","text":"Checking input length"},{"letter":"D","text":"Adding bounds checks"}],"answer":"A","rationale":"Unpredictable addresses make a chosen jump target unreliable.","source":"ICT2212 Wk 8-11","flag":false},{"id":32,"topic":"Memory bugs","bonus":false,"q":"NX / DEP prevents:","options":[{"letter":"A","text":"Reading memory"},{"letter":"B","text":"Executing code from the stack"},{"letter":"C","text":"Overwriting the return address"},{"letter":"D","text":"Stack growth"}],"answer":"B","rationale":"Injected shellcode cannot run if the stack is not executable.","source":"ICT2212 Wk 8-11","flag":false},{"id":33,"topic":"Memory bugs","bonus":false,"q":"The format string bug is caused by:","options":[{"letter":"A","text":"Passing user input as the format string"},{"letter":"B","text":"Using printf at all"},{"letter":"C","text":"Missing a semicolon"},{"letter":"D","text":"Using %s incorrectly"}],"answer":"A","rationale":"`printf(input)` lets the user supply specifiers like %x, %s and %n.","source":"ICT2212 Wk 8-11","flag":false},{"id":34,"topic":"Memory bugs","bonus":false,"q":"Which specifier lets an attacker WRITE to memory?","options":[{"letter":"A","text":"%x"},{"letter":"B","text":"%s"},{"letter":"C","text":"%n"},{"letter":"D","text":"%d"}],"answer":"C","rationale":"%n writes the number of characters printed to an address, enabling code execution.","source":"ICT2212 Wk 8-11","flag":false},{"id":35,"topic":"Memory bugs","bonus":false,"q":"The fix for `printf(user_input)` is:","options":[{"letter":"A","text":"`printf(user_input, \"%s\")`"},{"letter":"B","text":"`printf(\"%s\", user_input)`"},{"letter":"C","text":"`puts(user_input)` only if input is short"},{"letter":"D","text":"Escape all % characters"}],"answer":"B","rationale":"The user's text becomes an argument, never the format.","source":"ICT2212 Wk 8-11","flag":false},{"id":36,"topic":"Wireless","bonus":false,"q":"A fake AP broadcasting the same SSID as the real network is called:","options":[{"letter":"A","text":"Rogue AP"},{"letter":"B","text":"Evil twin"},{"letter":"C","text":"Honeypot"},{"letter":"D","text":"Wardriving"}],"answer":"B","rationale":"A rogue AP is any unauthorised AP on the network; an evil twin impersonates a specific SSID.","source":"ICT2212 Wk 8-11","flag":false},{"id":37,"topic":"Wireless","bonus":false,"q":"WEP is broken mainly because of:","options":[{"letter":"A","text":"Short passwords"},{"letter":"B","text":"RC4 keystream const KEY = "revision-quiz-v2";
const el = id => document.getElementById(id);

let st = { theme:"dark", active: QUIZZES[0].id, byQuiz: {} };

function blank(){ return { idx:0, mode:"mcq", topic:"", shuffled:false, results:{}, picks:{},
  flagged:[], revealed:[], typed:{}, retryIds:[], retry:false }; }
function qz(){ return QUIZZES.find(q => q.id === st.active) || QUIZZES[0]; }
function qs(){ if(!st.byQuiz[st.active]) st.byQuiz[st.active] = blank(); return st.byQuiz[st.active]; }
function load(){ try{ const r = localStorage.getItem(KEY); if(r) st = Object.assign(st, JSON.parse(r)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

function pool(){
  const s = qs();
  let p = qz().questions.slice();
  if(s.retry && s.retryIds.length) p = p.filter(q => s.retryIds.includes(q.id));
  else if(s.topic) p = p.filter(q => q.topic === s.topic);
  if(s.shuffled) p = p.map(q => [Math.random(), q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  return p;
}
function current(){ const p = pool(); if(!p.length) return null; return p[Math.min(qs().idx, p.length-1)]; }
function displayOptions(q){
  let o = q.options.slice();
  if(qs().shuffled) o = o.map(x => [Math.random(), x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  return o;
}
const letter = i => String.fromCharCode(65 + i);

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function answerText(q, full){
  const want = Array.isArray(q.answer) ? q.answer : [q.answer];
  const texts = want.map(l => { const o = q.options.find(x => x.letter === l); return o ? o.text : l; });
  return full ? texts.join(' \u00b7 ') : want.join(', ');
}

function renderTabs(){
  const html = QUIZZES.map(q => {
    const s = st.byQuiz[q.id] || {};
    const done = Object.keys(s.results || {}).length;
    return '<button class="tab" role="tab" data-quiz="'+q.id+'" aria-selected="'+(q.id===st.active)+'">'+
           '<span>'+esc(q.short)+'</span><span class="cnt">'+done+'/'+q.questions.length+'</span></button>';
  }).join("");
  el("tabs").innerHTML = html;
}

function render(){
  const s = qs(), quiz = qz(), p = pool();
  el("title").textContent = quiz.label;
  el("subtitle").innerHTML = quiz.sub + " &middot; " + quiz.questions.length + " questions";
  renderTabs();

  if(s.idx >= p.length) s.idx = Math.max(0, p.length - 1);
  const q = current();
  el("total").textContent = p.length;
  el("pos").textContent = p.length ? s.idx + 1 : 0;

  const answered = Object.keys(s.results).length;
  const right = Object.values(s.results).filter(v => v === "right").length;
  el("done").textContent = answered + "/" + quiz.questions.length;
  el("score").textContent = answered ? Math.round(right / answered * 100) + "%" : "\u2014";
  el("flagCount").textContent = s.flagged.length;
  el("barFill").style.width = (answered / quiz.questions.length * 100) + "%";

  if(!q){ el("card").innerHTML = '<div class="empty">No questions in this filter.</div>';
          el("nextBtn").disabled = true; el("prevBtn").disabled = true; return; }

  const res = s.results[q.id];
  const badges = ['<span class="pill topic">'+esc(q.topic)+'</span>',
                  '<span class="pill">Q'+q.id+'</span>'];
  if(q.bonus) badges.push('<span class="pill bonus">bonus</span>');
  if(q.flag)  badges.push('<span class="pill flag">verify</span>');
  if(s.flagged.includes(q.id)) badges.push('<span class="pill flag">flagged</span>');

  let body = "";
  if(s.mode === "mcq"){
    const opts = displayOptions(q);
    const isMulti = !!q.multi;
    const correctSet = isMulti ? q.answer : [q.answer];
    const rawPick = s.picks[q.id];
    const picked = isMulti ? (rawPick || []) : rawPick;
    body = '<div class="opts">' + opts.map((o, i) => {
      let cls = "opt";
      if(res){
        const isPick = isMulti ? picked.indexOf(o.letter) >= 0 : picked === o.letter;
        if(correctSet.indexOf(o.letter) >= 0) cls += " correct";
        else if(isPick) cls += " wrong";
        else cls += " dim";
      } else if(isMulti && picked.indexOf(o.letter) >= 0){
        cls += " sel";
      }
      return '<button class="'+cls+'" data-letter="'+o.letter+'" '+(res?"disabled":"")+'>'+
             '<span class="key">'+letter(i)+'</span><span>'+esc(o.text)+'</span></button>';
    }).join("") + '</div>';
    if(isMulti && !res){
      body += '<div class="nav" style="margin-top:14px"><div class="scorable">'+
              'Select all that apply &mdash; one wrong tick scores zero.</div>'+
              '<div class="spacer"></div><button class="btn primary" id="checkMulti">Check answer</button></div>';
    }
  } else {
    const shown = s.revealed.includes(q.id);
    body = '<textarea id="typedBox" placeholder="Type your answer, then reveal..." '+
           (shown?"disabled":"")+'>'+esc(s.typed[q.id]||"")+'</textarea>'+
           '<div class="nav"><div class="spacer"></div>'+
           (shown ? "" : '<button class="btn primary" id="revealBtn">Reveal answer</button>')+'</div>';
    if(shown){
      const correct = {text: answerText(q, true)};
      body += '<div class="fb"><div class="model">Model answer: <b>'+esc(correct.text)+'</b></div>'+
              (res ? '<div class="verdict '+(res==="right"?"ok":"bad")+'">Currently marked: '+
                     (res==="right"?"got it":"missed it")+'</div>' : "")+
              '<div class="nav"><button class="btn" data-mark="wrong">Missed it</button>'+
              '<button class="btn primary" data-mark="right">Got it</button></div></div>';
    }
  }

  let fb = "";
  if(res){
    fb = '<div class="fb">' +
      (s.mode === "mcq"
        ? '<div class="verdict '+(res==="right"?"ok":"bad")+'">'+(res==="right"?"\u2713 Correct":"\u2717 Incorrect")+
          ' &mdash; answer is '+answerText(q)+'</div>'
        : "") +
      '<div class="rat">'+esc(q.rationale)+'</div>' +
      '<div class="src">'+esc(q.source)+'</div></div>';
  }

  el("card").innerHTML = '<div class="badges">'+badges.join("")+'</div>' +
    '<p class="qtext">'+esc(q.q)+'</p>' + body + fb;

  el("prevBtn").disabled = s.idx === 0;
  el("nextBtn").disabled = false;
  el("nextBtn").textContent = (s.idx === p.length - 1) ? "Show summary" : "Next \u2192";
  el("flagBtn").textContent = s.flagged.includes(q.id) ? "Unflag" : "Flag";
  el("modeMcq").setAttribute("aria-pressed", s.mode === "mcq");
  el("modeTyped").setAttribute("aria-pressed", s.mode === "typed");
  el("topicSel").value = s.topic;
  el("shuffleBtn").textContent = s.shuffled ? "Shuffled \u2713" : "Shuffle";
  el("wrongBtn").textContent = s.retry ? "Retrying wrong \u2713 ("+s.retryIds.length+")" : "Retry wrong";
}

function answerMcq(l){
  const q = current(); if(!q) return; const s = qs();
  if(s.results[q.id]) return;
  if(q.multi){
    const cur = s.picks[q.id] || [];
    const at = cur.indexOf(l);
    if(at >= 0) cur.splice(at, 1); else cur.push(l);
    s.picks[q.id] = cur;
    save(); render(); return;
  }
  s.picks[q.id] = l;
  s.results[q.id] = (l === q.answer) ? "right" : "wrong";
  save(); render();
}
function checkMulti(){
  const q = current(); if(!q || !q.multi) return; const s = qs();
  if(s.results[q.id]) return;
  const got = (s.picks[q.id] || []).slice().sort().join(",");
  const want = q.answer.slice().sort().join(",");
  s.results[q.id] = (got && got === want) ? "right" : "wrong";
  save(); render();
}
function mark(ok){
  const q = current(); if(!q) return;
  qs().results[q.id] = ok ? "right" : "wrong";
  save(); render();
}
function next(){
  const s = qs(), p = pool();
  if(s.idx >= p.length - 1){ showSummary(); return; }
  s.idx++; save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function showSummary(){
  const s = qs(), quiz = qz();
  const byTopic = {};
  quiz.questions.forEach(q => {
    const r = s.results[q.id]; if(!r) return;
    byTopic[q.topic] = byTopic[q.topic] || {right:0,total:0};
    byTopic[q.topic].total++;
    if(r === "right") byTopic[q.topic].right++;
  });
  const done = Object.keys(s.results).length;
  const right = Object.values(s.results).filter(v => v === "right").length;
  const rows = Object.entries(byTopic).map(([t,v]) =>
    '<tr><td>'+esc(t)+'</td><td class="num">'+v.right+' / '+v.total+'</td>'+
    '<td class="num">'+Math.round(v.right/v.total*100)+'%</td></tr>').join("");
  const wrongIds = Object.entries(s.results).filter(([,v]) => v==="wrong").map(([k]) => "Q"+k);
  el("summary").style.display = "block";
  el("summary").innerHTML =
    '<h2>'+esc(quiz.label)+' &mdash; progress</h2>'+
    '<div class="scorebig">'+(done?Math.round(right/done*100):0)+'%</div>'+
    '<div class="scorable">'+right+' right of '+done+' answered &middot; '+quiz.questions.length+' in this bank'+
    (s.flagged.length ? ' &middot; flagged: '+s.flagged.map(i=>"Q"+i).join(", ") : "")+'</div>'+
    (rows ? '<table style="margin-top:18px"><tr><th>Topic</th><th class="num">Score</th><th class="num">%</th></tr>'+rows+'</table>' : "")+
    (wrongIds.length ? '<p class="scorable" style="margin-top:14px">Missed: '+wrongIds.join(", ")+'</p>' : "");
  el("summary").scrollIntoView({behavior:"smooth"});
}

function selectQuiz(id){
  st.active = id; save();
  el("summary").style.display = "none";
  const sel = el("topicSel");
  sel.innerHTML = '<option value="">All topics</option>';
  qz().questions.map(q => q.topic).filter((v,i,a) => a.indexOf(v) === i).forEach(t => {
    const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o);
  });
  render();
}

/* ---- wiring ---- */
load();
if(!QUIZZES.some(q => q.id === st.active)) st.active = QUIZZES[0].id;
if(!st.byQuiz[st.active]) st.byQuiz[st.active] = blank();
document.documentElement.setAttribute("data-theme", st.theme);
el("themeBtn").textContent = st.theme === "dark" ? "\u263C" : "\u263E";

el("themeBtn").onclick = () => {
  st.theme = st.theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", st.theme);
  el("themeBtn").textContent = st.theme === "dark" ? "\u263C" : "\u263E";
  save();
};
el("tabs").onclick = e => {
  const b = e.target.closest(".tab"); if(!b) return;
  selectQuiz(b.dataset.quiz);
};
el("modeMcq").onclick = () => { qs().mode = "mcq"; save(); render(); };
el("modeTyped").onclick = () => { qs().mode = "typed"; save(); render(); };
el("topicSel").onchange = e => {
  const s = qs();
  s.topic = e.target.value; s.retry = false; s.retryIds = []; s.idx = 0; save(); render();
};
el("shuffleBtn").onclick = () => { const s = qs(); s.shuffled = !s.shuffled; s.idx = 0; save(); render(); };
el("wrongBtn").onclick = () => {
  const s = qs();
  if(s.retry){ s.retry = false; s.retryIds = []; s.idx = 0; save(); render(); return; }
  const ids = qz().questions.filter(q => s.results[q.id] === "wrong").map(q => q.id);
  if(!ids.length){ alert("No wrong answers recorded yet in this quiz \u2014 answer some questions first."); return; }
  s.retryIds = ids; s.retry = true; s.idx = 0;
  ids.forEach(id => { delete s.results[id]; delete s.picks[id]; });
  save(); render();
};
el("sumBtn").onclick = showSummary;
el("resetBtn").onclick = () => {
  if(!confirm("Clear all answers, flags and progress for "+qz().label+"?")) return;
  const theme = st.theme;
  st.byQuiz[st.active] = blank(); st.theme = theme;
  el("summary").style.display = "none"; save(); render();
};
el("prevBtn").onclick = () => { const s = qs(); if(s.idx > 0){ s.idx--; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); } };
el("nextBtn").onclick = next;
el("flagBtn").onclick = () => {
  const q = current(); if(!q) return; const s = qs();
  const i = s.flagged.indexOf(q.id);
  if(i >= 0) s.flagged.splice(i,1); else s.flagged.push(q.id);
  save(); render();
};

el("card").addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if(e.target.id === "checkMulti"){ checkMulti(); return; }
  if(opt && !opt.disabled){ answerMcq(opt.dataset.letter); return; }
  const mk = e.target.closest("[data-mark]");
  if(mk){ mark(mk.dataset.mark === "right"); return; }
  if(e.target.id === "revealBtn"){
    const q = current(), s = qs();
    s.typed[q.id] = (el("typedBox") || {}).value || "";
    if(!s.revealed.includes(q.id)) s.revealed.push(q.id);
    save(); render(); return;
  }
});
el("card").addEventListener("input", e => {
  if(e.target.id === "typedBox"){ const q = current(); qs().typed[q.id] = e.target.value; save(); }
});

document.addEventListener("keydown", e => {
  if(e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  const s = qs(), k = e.key.toUpperCase();
  if(s.mode === "mcq" && k.length === 1 && "ABCD".includes(k)){ answerMcq(k); return; }
  if(s.mode === "mcq" && "1234".includes(k)){ answerMcq(letter(+k - 1)); return; }
  if(e.key === "Enter"){ e.preventDefault(); next(); return; }
  if(k === "F"){ el("flagBtn").click(); }
});

selectQuiz(st.active);
</script>
</body>
</html>
