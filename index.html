<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revision Quizzes</title>
<style>
  :root{
    --bg:#0f1115; --bg2:#151922; --card:#1a1f2b; --line:#2a3143;
    --fg:#e8ecf4; --muted:#8b96ad; --accent:#5b8def; --accent-soft:#5b8def22;
    --ok:#2fbf71; --ok-bg:#2fbf7118; --bad:#ef5b6b; --bad-bg:#ef5b6b18;
    --warn:#e0a13c; --warn-bg:#e0a13c18;
  }
  [data-theme="light"]{
    --bg:#f6f7fb; --bg2:#ffffff; --card:#ffffff; --line:#e2e6ef;
    --fg:#1a2033; --muted:#6b7488; --accent:#3b6fd4; --accent-soft:#3b6fd414;
    --ok:#1f9e5b; --ok-bg:#1f9e5b14; --bad:#d43d4f; --bad-bg:#d43d4f14;
    --warn:#b57b1e; --warn-bg:#b57b1e14;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;
    background:radial-gradient(1100px 600px at 15% -10%, var(--accent-soft), transparent 60%),
      linear-gradient(180deg, var(--bg), var(--bg2) 60%);
    color:var(--fg);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:780px;margin:0 auto;padding:26px 20px 80px}
  header{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px}
  h1{font-size:1.3rem;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.85rem;margin-top:3px}
  .theme{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:7px 11px;cursor:pointer;font-size:.85rem;flex:none}
  .theme:hover{border-color:var(--accent)}

  .tabs{display:flex;gap:5px;background:var(--card);border:1px solid var(--line);
    border-radius:13px;padding:4px;margin-bottom:18px}
  .tab{flex:1;background:transparent;border:0;color:var(--muted);cursor:pointer;
    font:inherit;font-size:.88rem;font-weight:550;padding:9px 10px;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25}
  .tab:hover{color:var(--fg)}
  .tab[aria-selected="true"]{background:var(--accent);color:#fff}
  .tab .cnt{font-size:.72rem;font-weight:400;opacity:.75}

  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 10px}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#8f6bef);
    border-radius:99px;transition:width .35s ease}
  .stats{display:flex;gap:18px;color:var(--muted);font-size:.83rem;flex-wrap:wrap}
  .stats b{color:var(--fg);font-weight:600}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 20px}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
  .seg button{background:transparent;border:0;color:var(--muted);padding:7px 13px;border-radius:8px;
    cursor:pointer;font-size:.86rem;font-weight:500;font-family:inherit}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  select,.btn{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:11px;
    padding:9px 12px;font-size:.87rem;cursor:pointer;font-family:inherit}
  select:hover,.btn:hover{border-color:var(--accent)}
  .btn.ghost{color:var(--muted)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;
    box-shadow:0 10px 30px #00000022}
  .badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .pill{font-size:.71rem;letter-spacing:.04em;text-transform:uppercase;font-weight:600;
    padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .pill.topic{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .pill.bonus{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
  .pill.flag{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
  .qtext{font-size:1.1rem;line-height:1.5;margin:0 0 20px;font-weight:550}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
    background:transparent;border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:13px 15px;cursor:pointer;font:inherit;line-height:1.45;
    transition:border-color .15s,background .15s,transform .08s}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
  .opt:active:not(:disabled){transform:scale(.995)}
  .opt .key{flex:0 0 26px;height:26px;border-radius:7px;border:1px solid var(--line);
    display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .key{border-color:var(--ok);color:var(--ok)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .key{border-color:var(--bad);color:var(--bad)}
  .opt.dim{opacity:.45}

  textarea{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--line);
    color:var(--fg);border-radius:12px;padding:13px 15px;font:inherit;resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}

  .fb{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .verdict{font-weight:650;font-size:.95rem;margin-bottom:8px}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .rat{color:var(--fg);opacity:.92;font-size:.94rem}
  .src{margin-top:12px;font-size:.79rem;color:var(--muted);border-left:2px solid var(--line);
    padding:2px 0 2px 11px;word-break:break-word}
  .model{background:var(--ok-bg);border:1px solid var(--ok);border-radius:12px;padding:12px 14px;
    font-size:.94rem;margin-bottom:12px}
  .model b{color:var(--ok)}

  .nav{display:flex;gap:10px;align-items:center;margin-top:20px}
  .nav .spacer{flex:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:disabled{opacity:.4;cursor:not-allowed}

  .summary{display:none;margin-top:22px}
  .summary h2{font-size:1.05rem;margin:0 0 14px}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .scorebig{font-size:2.4rem;font-weight:700;letter-spacing:-.02em;line-height:1}
  .scorable{color:var(--muted);font-size:.85rem;margin-top:4px}
  .hint{color:var(--muted);font-size:.78rem;margin-top:14px}
  kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
    font-size:.75rem;font-family:inherit}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="title">Revision Quizzes</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <button class="theme" id="themeBtn" title="Toggle theme">&#9788;</button>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="bar"><i id="barFill"></i></div>
  <div class="stats">
    <span>Question <b id="pos">1</b> / <b id="total">0</b></span>
    <span>Answered <b id="done">0</b></span>
    <span>Score <b id="score">&mdash;</b></span>
    <span>Flagged <b id="flagCount">0</b></span>
  </div>

  <div class="toolbar">
    <div class="seg" role="group">
      <button id="modeMcq" aria-pressed="true">Multiple choice</button>
      <button id="modeTyped" aria-pressed="false">Type answer</button>
    </div>
    <select id="topicSel"><option value="">All topics</option></select>
    <button class="btn" id="shuffleBtn">Shuffle</button>
    <button class="btn" id="wrongBtn">Retry wrong</button>
    <button class="btn ghost" id="sumBtn">Summary</button>
    <button class="btn ghost" id="resetBtn">Reset</button>
  </div>

  <div class="card" id="card"></div>

  <div class="nav">
    <button class="btn" id="prevBtn">&larr; Prev</button>
    <button class="btn" id="flagBtn">Flag</button>
    <div class="spacer"></div>
    <button class="btn primary" id="nextBtn">Next &rarr;</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="hint">
    Keys: <kbd>A</kbd>&ndash;<kbd>D</kbd> or <kbd>1</kbd>&ndash;<kbd>4</kbd> to answer &middot;
    <kbd>Enter</kbd> next &middot; <kbd>F</kbd> flag &middot; progress is saved per quiz in this browser
  </div>
</div>

<script>
const QUIZZES = [{"id":"ict2212","label":"ICT2212 Quiz 1","short":"ICT2212","sub":"Ethical Hacking &middot; Weeks 1&ndash;5","questions":[{"id":1,"topic":"Introduction","bonus":false,"q":"An ethical hacker has finished reconnaissance and now uses the gathered information to examine the target's security posture more closely. Which process stage is this?","options":[{"letter":"A","text":"Scanning"},{"letter":"B","text":"Enumeration"},{"letter":"C","text":"Gaining Access"},{"letter":"D","text":"Maintaining Access"}],"answer":"A","rationale":"Scanning uses reconnaissance information to examine the target's security posture more closely.","source":"Brief §2, six-stage hacking process; source: Lecture 1 lines 148–280","flag":false},{"id":2,"topic":"Introduction","bonus":false,"q":"Which item should a penetration-test report not disclose according to the brief?","options":[{"letter":"A","text":"What security gaps were found"},{"letter":"B","text":"How the vulnerabilities can be closed"},{"letter":"C","text":"The exact methods used to discover the gaps"},{"letter":"D","text":"Steps the client should follow in future"}],"answer":"C","rationale":"The report states what gaps were found and how to plug them, not how the tester found them.","source":"Brief §2, penetration-test report; source: Lecture 1 lines 56–65","flag":false},{"id":3,"topic":"Introduction","bonus":false,"q":"Which penetration-testing model gives the tester network topology, technologies and other detailed information, and may allow interviews with IT staff?","options":[{"letter":"A","text":"Black box"},{"letter":"B","text":"Gray box"},{"letter":"C","text":"White box"},{"letter":"D","text":"Physical box"}],"answer":"C","rationale":"White-box testing provides detailed prior knowledge and may include interviews with IT staff.","source":"Brief §2, penetration-testing models; source: Lecture 1 lines 380–406","flag":false},{"id":4,"topic":"Introduction","bonus":false,"q":"Which penetration-testing model gives the tester no prior knowledge and can test whether security personnel detect the attack?","options":[{"letter":"A","text":"White box"},{"letter":"B","text":"Black box"},{"letter":"C","text":"Gray box"},{"letter":"D","text":"Focused box"}],"answer":"B","rationale":"Black-box testing gives no prior knowledge and can evaluate whether defenders detect the attack.","source":"Brief §2, penetration-testing models; source: Lecture 1 lines 380–406","flag":false},{"id":5,"topic":"Introduction","bonus":false,"q":"In the ethical-hacking process, what does Covering Tracks mean for an ethical hacker?","options":[{"letter":"A","text":"Preserving access for future exploitation"},{"letter":"B","text":"Performing cleanup to avoid leaving test artefacts"},{"letter":"C","text":"Identifying user and administrator accounts"},{"letter":"D","text":"Reporting the exact discovery method to the client"}],"answer":"B","rationale":"Covering Tracks means cleanup in an ethical-hacking engagement.","source":"Brief §2, six-stage hacking process; source: Lecture 1 lines 148–280","flag":false},{"id":6,"topic":"Introduction","bonus":false,"q":"Which statement correctly describes the security asymmetry taught in the lecture?","options":[{"letter":"A","text":"An attacker must know every weakness, while an administrator needs to know only one."},{"letter":"B","text":"An attacker and an administrator each need to know only one weakness."},{"letter":"C","text":"An attacker needs to know only one weakness, while an administrator must know all weaknesses for complete defence."},{"letter":"D","text":"An administrator can create an absolute defence by air-gapping every system."}],"answer":"C","rationale":"One weakness may be enough for an attacker, whereas complete defence requires the administrator to know all weaknesses.","source":"Brief §2, “The asymmetry”; source: Lecture 1 lines 86–123","flag":false},{"id":7,"topic":"Reconnaissance","bonus":false,"q":"In the lecturer's house analogy, which activity is equivalent to surveying the exterior of the chosen house?","options":[{"letter":"A","text":"Reconnaissance"},{"letter":"B","text":"Footprinting"},{"letter":"C","text":"Scanning"},{"letter":"D","text":"Enumeration"}],"answer":"B","rationale":"Footprinting surveys the exterior; reconnaissance chooses the house and scanning tests doors and windows.","source":"Brief §8, Reconnaissance / Footprinting / Scanning; §3; source: Lecture 2 lines 40–95","flag":false},{"id":8,"topic":"Reconnaissance","bonus":false,"q":"Which description correctly identifies a domain-name registry rather than a registrar?","options":[{"letter":"A","text":"It offers registration services and must earn ICANN accreditation."},{"letter":"B","text":"It holds the database of all registered names in a given TLD and operates under contract with ICANN."},{"letter":"C","text":"It translates a domain name into an IP address interactively."},{"letter":"D","text":"It stores historical snapshots of websites."}],"answer":"B","rationale":"A registry holds the TLD database under ICANN contract; a registrar offers registration services and needs accreditation.","source":"Brief §8, registrar vs registry; §3; source: Lecture 2 lines 98–240","flag":false},{"id":9,"topic":"Reconnaissance","bonus":false,"q":"In `singaporetech.edu.sg`, which portion is the top-level domain (TLD)?","options":[{"letter":"A","text":"`singaporetech`"},{"letter":"B","text":"`.edu`"},{"letter":"C","text":"`.edu.sg`"},{"letter":"D","text":"`.sg`"}],"answer":"D","rationale":"The TLD is the rightmost portion, `.sg`; the SLD is the next portion right-to-left.","source":"Brief §8, TLD vs SLD; §3, domain anatomy","flag":false},{"id":10,"topic":"Reconnaissance","bonus":false,"q":"An attacker invents a believable identity-verification scenario and builds sympathy and trust before asking for information. Which technique best fits?","options":[{"letter":"A","text":"Phishing"},{"letter":"B","text":"Pretexting"},{"letter":"C","text":"Baiting"},{"letter":"D","text":"Quid pro quo"}],"answer":"B","rationale":"Pretexting uses a fabricated scenario and false trust, unlike phishing's fear and urgency.","source":"Brief §8, Phishing vs pretexting; §3; source: Lecture 2 lines 470–590","flag":false},{"id":11,"topic":"Reconnaissance","bonus":false,"q":"An attacker drops a malware-loaded USB drive and relies on curiosity to make an employee use it. Which technique best fits?","options":[{"letter":"A","text":"Baiting"},{"letter":"B","text":"Quid pro quo"},{"letter":"C","text":"Pretexting"},{"letter":"D","text":"Tailgating"}],"answer":"A","rationale":"Baiting uses enticement and may use physical media such as a dropped malware-loaded USB drive.","source":"Brief §8, Baiting vs quid pro quo; §3; source: Lecture 2 lines 470–590","flag":false},{"id":12,"topic":"Reconnaissance","bonus":false,"q":"Which action is shoulder surfing, rather than tailgating?","options":[{"letter":"A","text":"Following an employee through a restricted door without authenticating"},{"letter":"B","text":"Starting a conversation to appear familiar at the front desk"},{"letter":"C","text":"Secretly observing a person's screen or keystrokes to obtain private information"},{"letter":"D","text":"Offering technical support in exchange for disabling antivirus software"}],"answer":"C","rationale":"Shoulder surfing visually observes information; tailgating follows an authorised person into a restricted area.","source":"Brief §8, Tailgating vs shoulder surfing; §3","flag":false},{"id":13,"topic":"Reconnaissance","bonus":false,"q":"Which statement best distinguishes Google hacking from hacking Google?","options":[{"letter":"A","text":"It attacks Google's servers using malformed search requests."},{"letter":"B","text":"It uses Google's search operators to locate information exposed by other misconfigured sites."},{"letter":"C","text":"It changes Google's index so private pages become public."},{"letter":"D","text":"It is another name for searching internet-connected devices with Shodan."}],"answer":"B","rationale":"Google hacking uses search operators to find exposed information on other sites; it does not attack Google.","source":"Brief §8, Google hacking vs hacking Google; §3; source: Lecture 2 lines 619–763","flag":false},{"id":14,"topic":"Reconnaissance","bonus":false,"q":"Which statement correctly distinguishes a Google dork from the Google Hacking Database (GHDB)?","options":[{"letter":"A","text":"A dork is a query; the GHDB is a database of such queries."},{"letter":"B","text":"A dork is a database; the GHDB is one query selected from it."},{"letter":"C","text":"A dork searches devices; the GHDB stores historical website snapshots."},{"letter":"D","text":"A dork is active reconnaissance; the GHDB is a port scanner."}],"answer":"A","rationale":"A dork is the search query, while the GHDB is a database of dorks.","source":"Brief §8, Dork vs GHDB; §3","flag":false},{"id":15,"topic":"Reconnaissance","bonus":false,"q":"Which pairing is correct?","options":[{"letter":"A","text":"Wayback Machine — search engine for internet-connected devices; Shodan — historical website snapshots"},{"letter":"B","text":"Wayback Machine — historical website snapshots; Shodan — search engine for internet-connected devices"},{"letter":"C","text":"Wayback Machine — graphical link analysis; Shodan — DNS record lookup"},{"letter":"D","text":"Wayback Machine — vulnerability scanner; Shodan — domain registrar"}],"answer":"B","rationale":"Wayback stores historical website snapshots; Shodan searches for internet-connected devices.","source":"Brief §8, Wayback Machine vs Shodan; §3; source: Lecture 2 lines 775–902","flag":false},{"id":16,"topic":"Scanning & Enumeration","bonus":false,"q":"Which statement correctly distinguishes a ping sweep from a port scan?","options":[{"letter":"A","text":"A ping sweep finds open services; a port scan only determines whether a host is alive."},{"letter":"B","text":"A ping sweep determines whether hosts are alive; a port scan identifies open, closed or filtered ports."},{"letter":"C","text":"A ping sweep enumerates user accounts; a port scan discovers domain registrants."},{"letter":"D","text":"A ping sweep and a port scan always perform the same probes."}],"answer":"B","rationale":"A ping sweep asks whether hosts are alive; a port scan classifies ports as open, closed or filtered.","source":"Brief §8, Ping sweep vs port scan; §4","flag":false},{"id":17,"topic":"Scanning & Enumeration","bonus":false,"q":"Which ICMP type pairing is correct for an echo exchange?","options":[{"letter":"A","text":"Echo Request Type 0; Echo Reply Type 8"},{"letter":"B","text":"Echo Request Type 8; Echo Reply Type 0"},{"letter":"C","text":"Echo Request Type 13; Echo Reply Type 14"},{"letter":"D","text":"Echo Request Type 14; Echo Reply Type 13"}],"answer":"B","rationale":"ICMP Echo Request is Type 8 and Echo Reply is Type 0.","source":"Brief §§4, 7 and 8; source: Lecture 3 lines 230–266","flag":false},{"id":18,"topic":"Scanning & Enumeration","bonus":false,"q":"When ordinary ICMP echo requests are blocked, which ICMP timestamp pairing can be used as a non-echo alternative?","options":[{"letter":"A","text":"Request Type 0; Reply Type 8"},{"letter":"B","text":"Request Type 8; Reply Type 0"},{"letter":"C","text":"Request Type 13; Reply Type 14"},{"letter":"D","text":"Request Type 14; Reply Type 13"}],"answer":"C","rationale":"ICMP Timestamp Request is Type 13 and Timestamp Reply is Type 14 under RFC 792.","source":"Brief §§4, 7 and 8; source: Lecture 3 lines 247–300","flag":false},{"id":19,"topic":"Scanning & Enumeration","bonus":false,"q":"Which nmap flag performs host discovery as a ping sweep without scanning ports?","options":[{"letter":"A","text":"`-sn`"},{"letter":"B","text":"`-PE`"},{"letter":"C","text":"`-PP`"},{"letter":"D","text":"`-Pn`"}],"answer":"A","rationale":"`-sn` performs a ping sweep only and does not scan ports.","source":"Brief §§4, 7 and 8, `-sn` vs `-PE` vs `-PP`; source: Lecture 3 lines 208–334","flag":false},{"id":20,"topic":"Scanning & Enumeration","bonus":false,"q":"Which nmap flag requests an ICMP non-echo timestamp sweep with a port scan?","options":[{"letter":"A","text":"`-sn`"},{"letter":"B","text":"`-PE`"},{"letter":"C","text":"`-PP`"},{"letter":"D","text":"`-Pn`"}],"answer":"C","rationale":"`-PP` performs the non-echo timestamp sweep with a port scan.","source":"Brief §§4, 7 and 8, `-sn` vs `-PE` vs `-PP`; source: Lecture 3 lines 208–334","flag":false},{"id":21,"topic":"Scanning & Enumeration","bonus":false,"q":"Which statement correctly contrasts TCP and UDP sweeps as presented in the lecture?","options":[{"letter":"A","text":"TCP is connection-oriented and generally easier to determine; UDP is connectionless and more difficult."},{"letter":"B","text":"TCP is connectionless and usually slower; UDP is connection-oriented and usually faster."},{"letter":"C","text":"TCP relies on ICMP Port Unreachable for closed ports; UDP relies on SYN ACK."},{"letter":"D","text":"TCP uses `-sU`; UDP uses `-sT` or `-sS`."}],"answer":"A","rationale":"TCP is connection-oriented and generally easier to determine; UDP is connectionless and more difficult.","source":"Brief §8, TCP sweep vs UDP sweep; §4; source: Lecture 3 lines 539–603","flag":false},{"id":22,"topic":"Scanning & Enumeration","bonus":false,"q":"A SYN probe produces no response from the remote host after retransmissions. How is the port classified in the brief?","options":[{"letter":"A","text":"Open"},{"letter":"B","text":"Closed"},{"letter":"C","text":"Filtered"},{"letter":"D","text":"Enumerated"}],"answer":"C","rationale":"In the stated port-scan model, no response indicates a filtered port.","source":"Brief §8, Open vs closed vs filtered; §4; source: Lecture 3 lines 680–723","flag":false},{"id":23,"topic":"Scanning & Enumeration","bonus":false,"q":"Which scan completes the full three-way handshake, requires no special privileges, and is noisy and easily detected?","options":[{"letter":"A","text":"TCP Connect() scan (`-sT`)"},{"letter":"B","text":"TCP SYN scan (`-sS`)"},{"letter":"C","text":"TCP FIN scan (`-sF`)"},{"letter":"D","text":"UDP scan (`-sU`)"}],"answer":"A","rationale":"TCP Connect (`-sT`) completes the handshake, needs no special privileges and is noisy.","source":"Brief §8, Connect vs SYN vs FIN; §4; source: Lecture 3 lines 727–749","flag":false},{"id":24,"topic":"Scanning & Enumeration","bonus":false,"q":"Which scan sends SYN, receives SYN ACK for an open port, then tears down the connection with RST before completing the handshake?","options":[{"letter":"A","text":"TCP Connect() scan (`-sT`)"},{"letter":"B","text":"TCP SYN / half-open scan (`-sS`)"},{"letter":"C","text":"TCP FIN scan (`-sF`)"},{"letter":"D","text":"UDP scan (`-sU`)"}],"answer":"B","rationale":"A SYN or half-open scan (`-sS`) tears down with RST before completing the handshake.","source":"Brief §8, Connect vs SYN vs FIN; §4; source: Lecture 3 lines 753–776","flag":false},{"id":25,"topic":"Scanning & Enumeration","bonus":false,"q":"Which scan is fast and stealthy but cannot distinguish an open port from a filtered port because both may give no response?","options":[{"letter":"A","text":"TCP Connect() scan (`-sT`)"},{"letter":"B","text":"TCP SYN scan (`-sS`)"},{"letter":"C","text":"TCP FIN scan (`-sF`)"},{"letter":"D","text":"UDP scan (`-sU`)"}],"answer":"C","rationale":"A FIN scan (`-sF`) gets no response from both open and filtered ports, so it cannot distinguish them.","source":"Brief §8, Connect vs SYN vs FIN; §4; source: Lecture 3 lines 780–810","flag":false},{"id":26,"topic":"Scanning & Enumeration","bonus":false,"q":"Which route-tracing tool pairing is correct?","options":[{"letter":"A","text":"Linux/Unix: `tracert`; Windows: `traceroute`"},{"letter":"B","text":"Linux/Unix: `traceroute`; Windows: `tracert`"},{"letter":"C","text":"Linux/Unix: `nslookup`; Windows: `dig`"},{"letter":"D","text":"Linux/Unix: `fping`; Windows: `dnsmap`"}],"answer":"B","rationale":"`traceroute` is the Linux/Unix tool and `tracert` is the Windows tool.","source":"Brief §8, traceroute vs tracert; §4; source: Lecture 3 lines 946–1005","flag":false},{"id":27,"topic":"Scanning & Enumeration","bonus":false,"q":"Which statement correctly distinguishes enumeration from scanning?","options":[{"letter":"A","text":"Enumeration is passive and only determines whether a host is alive."},{"letter":"B","text":"Enumeration is more intrusive, using active connections to extract shares and user-account information."},{"letter":"C","text":"Scanning extracts shares and user accounts, while enumeration only identifies open ports."},{"letter":"D","text":"Scanning and enumeration are identical names for passive Google searches."}],"answer":"B","rationale":"Enumeration is more intrusive because it queries through active connections to extract shares and user-account information.","source":"Brief §8, Scanning vs enumeration; §4; source: Lecture 3 lines 1014–1167","flag":false},{"id":28,"topic":"Scanning & Enumeration","bonus":false,"q":"In `nmap -sV -v -n -Pn --script banner <ip>`, which flag skips the initial ping test because modern firewalls may block ICMP requests?","options":[{"letter":"A","text":"`-sV`"},{"letter":"B","text":"`-n`"},{"letter":"C","text":"`-Pn`"},{"letter":"D","text":"`-v`"}],"answer":"C","rationale":"`-Pn` skips the initial ping test; `-n` disables reverse DNS and `-sV` detects service versions.","source":"Brief §§4 and 7, banner-grabbing command; source: Lecture 3 lines 1014–1167","flag":false},{"id":29,"topic":"Gain Access / System Hacking","bonus":false,"q":"Which configuration has the smaller attack surface?","options":[{"letter":"A","text":"A feature runs by default."},{"letter":"B","text":"A service accepts anonymous access."},{"letter":"C","text":"Code runs as administrator or root."},{"letter":"D","text":"A network endpoint is restricted to a subnet or LAN."}],"answer":"D","rationale":"Restricting an endpoint to a subnet or LAN produces a smaller attack surface than internet exposure and the other listed broad-access choices.","source":"Brief §8, Larger vs smaller attack surface; §5; source: Lecture 5 lines 69–131","flag":false},{"id":30,"topic":"Gain Access / System Hacking","bonus":false,"q":"Which control reduces damage potential by granting higher permissions only for as long as needed?","options":[{"letter":"A","text":"Authentication"},{"letter":"B","text":"Authorisation"},{"letter":"C","text":"Anonymous access"},{"letter":"D","text":"Increasing the number of entry-point URLs"}],"answer":"B","rationale":"Authorisation limits privilege and damage potential; authentication controls who may enter.","source":"Brief §5, attack-surface reduction; source: Lecture 5 lines 69–131","flag":false},{"id":31,"topic":"Gain Access / System Hacking","bonus":false,"q":"In the attack-surface model, which resource is a channel rather than a method or data item?","options":[{"letter":"A","text":"An entry or exit point"},{"letter":"B","text":"A port, RPC or web service"},{"letter":"C","text":"A file, cookie or registry entry"},{"letter":"D","text":"A direct method's privilege level"}],"answer":"B","rationale":"Channels include ports, RPCs and web services; methods are entry/exit points and data items include files, cookies and registry entries.","source":"Brief §8, Method vs channel vs data item; §5; source: Lecture 5 lines 149–198","flag":false},{"id":32,"topic":"Gain Access / System Hacking","bonus":false,"q":"Which statement correctly distinguishes salting from hashing?","options":[{"letter":"A","text":"Hashing adds random data; salting reverses the resulting digest."},{"letter":"B","text":"Hashing is one-way; salting adds random data before hashing so the same password can produce different values at different sites."},{"letter":"C","text":"Hashing stores plaintext; salting encrypts it with a reusable key."},{"letter":"D","text":"Hashing and salting are two names for pre-computing rainbow tables."}],"answer":"B","rationale":"Hashing is one-way; salting adds random data before hashing so identical strings can hash differently.","source":"Brief §8, Salting vs hashing; §5; source: Lecture 5 lines 348–397","flag":false},{"id":33,"topic":"Gain Access / System Hacking","bonus":false,"q":"Which statement correctly contrasts LM and NTLM?","options":[{"letter":"A","text":"LM uses MD4 and Unicode; NTLM splits the password into two upper-case 7-character strings and applies DES."},{"letter":"B","text":"LM is salted; NTLM is unsalted."},{"letter":"C","text":"LM splits the password into two upper-case 7-character strings and applies DES; NTLM uses MD4 and Unicode. Both are unsalted."},{"letter":"D","text":"LM and NTLM both use SHA-256 and 32-byte hashes."}],"answer":"C","rationale":"LM uses upper-case 7+7 character halves and DES; NTLM uses MD4 and Unicode; both are unsalted.","source":"Brief §§5, 7 and 8, LM vs NTLM; source: Lecture 5 lines 419–455","flag":false},{"id":34,"topic":"Gain Access / System Hacking","bonus":false,"q":"Which hash-size statement matches the brief exactly?","options":[{"letter":"A","text":"SHA-1 is 128-bit; SHA-256 is 256-bit (16 bytes)."},{"letter":"B","text":"SHA-1 is 160-bit; SHA-256 is 256-bit (32 bytes)."},{"letter":"C","text":"SHA-1 is 256-bit; SHA-256 is 160-bit (32 bytes)."},{"letter":"D","text":"SHA-1 is 160-bit; SHA-256 is 512-bit (64 bytes)."}],"answer":"B","rationale":"SHA-1 is 160-bit, while SHA-256 produces a 256-bit or 32-byte hash.","source":"Brief §§5 and 7; source: Lecture 5 lines 464–478","flag":false},{"id":35,"topic":"Gain Access / System Hacking","bonus":false,"q":"Which password attack uses dictionary words and their variations, followed by brute force?","options":[{"letter":"A","text":"Dictionary attack"},{"letter":"B","text":"Brute-force attack"},{"letter":"C","text":"Hybrid attack"},{"letter":"D","text":"Rainbow-tables attack"}],"answer":"C","rationale":"A hybrid attack tries dictionary words and variations, then brute force.","source":"Brief §8, password-attack distinctions; §5; source: Lecture 5 lines 533–564","flag":false},{"id":36,"topic":"Gain Access / System Hacking","bonus":false,"q":"Which password attack relies on lists of pre-computed hashes?","options":[{"letter":"A","text":"Dictionary attack"},{"letter":"B","text":"Brute-force attack"},{"letter":"C","text":"Hybrid attack"},{"letter":"D","text":"Rainbow-tables attack"}],"answer":"D","rationale":"Rainbow-tables attacks use lists of pre-computed hashes.","source":"Brief §8, password-attack distinctions; §5; source: Lecture 5 lines 533–564","flag":false},{"id":37,"topic":"Gain Access / System Hacking","bonus":false,"q":"Which tool is specifically described as a password cracker based on rainbow tables?","options":[{"letter":"A","text":"PwDump"},{"letter":"B","text":"John the Ripper"},{"letter":"C","text":"Ophcrack"},{"letter":"D","text":"THC Hydra"}],"answer":"C","rationale":"Ophcrack is specifically identified as a rainbow-table-based password cracker.","source":"Brief §5, password-cracking tools; source: Lecture 5 lines 643–717","flag":false},{"id":38,"topic":"Gain Access / System Hacking","bonus":false,"q":"What is the correct first comparison workflow for Microsoft Attack Surface Analyzer 2.0?","options":[{"letter":"A","text":"Install the target app, remove all baseline data, then run one scan."},{"letter":"B","text":"Run a baseline scan, install the target app, run another scan, then compare the results."},{"letter":"C","text":"Run a password dictionary attack, install the target app, then compare hashes."},{"letter":"D","text":"Enumerate remote user accounts, uninstall the target app, then compare network routes."}],"answer":"B","rationale":"The Analyzer workflow is baseline scan, install the app, scan again and compare against the baseline.","source":"Brief §5, Microsoft Attack Surface Analyzer; source: Lecture 5 lines 307–341","flag":false},{"id":39,"topic":"Sniffing (bonus)","bonus":true,"q":"BONUS: Which statement correctly distinguishes passive from active sniffing?","options":[{"letter":"A","text":"Passive sniffing injects packets to bypass switch segmentation; active sniffing only listens on a hub."},{"letter":"B","text":"Passive sniffing relies on promiscuous mode and works well on hubs; active sniffing can use ARP spoofing to bypass switch segmentation."},{"letter":"C","text":"Passive sniffing requires ARP poisoning; active sniffing cannot modify network traffic."},{"letter":"D","text":"Passive and active sniffing both work only when the NIC rejects promiscuous mode."}],"answer":"B","rationale":"Passive sniffing listens in promiscuous mode on hubs; active sniffing such as ARP spoofing bypasses switch segmentation.","source":"Brief §§6 and 8, Passive vs active sniffing; source: Lecture 4 lines 41–105","flag":false},{"id":40,"topic":"Sniffing (bonus)","bonus":true,"q":"BONUS: Which control-to-threat mapping matches the lecture?","options":[{"letter":"A","text":"Encryption — replay; hashing — privacy; timestamp — integrity"},{"letter":"B","text":"Encryption — integrity; hashing — replay; timestamp — privacy"},{"letter":"C","text":"Encryption — privacy; hashing — integrity; timestamp — replay"},{"letter":"D","text":"Encryption — birthday attacks; hashing — privacy; timestamp — key management"}],"answer":"C","rationale":"Encryption protects privacy, hashing protects integrity, and timestamps defend against replay attacks.","source":"Brief §§6 and 8, Encryption vs hashing vs timestamp; source: Lecture 4 lines 110–148","flag":false},{"id":41,"topic":"Introduction","bonus":false,"q":"What is the defining characteristic of an ethical hacker compared to a malicious attacker?","options":[{"letter":"A","text":"They use different tools"},{"letter":"B","text":"They operate with permission and professional intent, and their attacks are non-destructive"},{"letter":"C","text":"They only test their own systems"},{"letter":"D","text":"They report vulnerabilities to software vendors"}],"answer":"B","rationale":"Ethical hackers operate with permission/professional intent and attacks are non-destructive","source":"§2 — EH definition","flag":false},{"id":42,"topic":"Introduction","bonus":false,"q":"Based on the Coverity scan estimate of under 1 bug per 1,000 lines of code, approximately how many bugs might Windows 7 contain?","options":[{"letter":"A","text":"4,000"},{"letter":"B","text":"40,000"},{"letter":"C","text":"400,000"},{"letter":"D","text":"10,000"}],"answer":"B","rationale":"40–50M LOC × <1 bug/1,000 lines ≈ 40,000 bugs","source":"§2 — Defence feasibility","flag":false},{"id":43,"topic":"Introduction","bonus":false,"q":"What is the correct order of the first four stages in the ethical hacking process?","options":[{"letter":"A","text":"Scanning → Reconnaissance → Enumeration → Gaining Access"},{"letter":"B","text":"Reconnaissance → Scanning → Enumeration → Gaining Access"},{"letter":"C","text":"Reconnaissance → Enumeration → Scanning → Gaining Access"},{"letter":"D","text":"Enumeration → Reconnaissance → Scanning → Gaining Access"}],"answer":"B","rationale":"Correct sequence: Reconnaissance → Scanning → Enumeration → Gaining Access","source":"§2 — 6-stage process","flag":false},{"id":44,"topic":"Introduction","bonus":false,"q":"Which of the following is NOT listed as a pentester requirement in the brief?","options":[{"letter":"A","text":"Knowledge of computer and network technologies"},{"letter":"B","text":"Awareness of the laws"},{"letter":"C","text":"Ability to communicate with management and IT personnel"},{"letter":"D","text":"Certification from a recognised body (e.g. CREST)"}],"answer":"D","rationale":"Pentester requirements: knowledge, tools, communication, law awareness — no certification listed","source":"§2 — Pentester requirements","flag":true},{"id":45,"topic":"Reconnaissance","bonus":false,"q":"In the lecturer's house analogy, reconnaissance answers which question?","options":[{"letter":"A","text":"Surveying the house exterior"},{"letter":"B","text":"Finding which doors and windows are open or closed"},{"letter":"C","text":"Deciding which house you are robbing"},{"letter":"D","text":"Entering the house"}],"answer":"C","rationale":"Reconnaissance = \"which house?\" (footprinting = survey exterior; scanning = doors/windows)","source":"§3 — Lecturer's analogy; §8 trap","flag":false},{"id":46,"topic":"Reconnaissance","bonus":false,"q":"WHOIS uses which protocol, transport, and port?","options":[{"letter":"A","text":"UDP, port 43"},{"letter":"B","text":"TCP, port 43"},{"letter":"C","text":"TCP, port 53"},{"letter":"D","text":"UDP, port 53"}],"answer":"B","rationale":"WHOIS = TCP-based, port 43","source":"§3 — Whois protocol detail","flag":false},{"id":47,"topic":"Reconnaissance","bonus":false,"q":"A registrar wanting to offer domain registration services must earn accreditation from which body?","options":[{"letter":"A","text":"Verisign"},{"letter":"B","text":"InterNIC"},{"letter":"C","text":"ICANN"},{"letter":"D","text":"IETF"}],"answer":"C","rationale":"Registrars must earn ICANN accreditation","source":"§3 — Whois: registrar/registry","flag":false},{"id":48,"topic":"Reconnaissance","bonus":false,"q":"Which DNS record type maps a domain name to its IP address?","options":[{"letter":"A","text":"MX"},{"letter":"B","text":"NS"},{"letter":"C","text":"A"},{"letter":"D","text":"SOA"}],"answer":"C","rationale":"A record = Address Mapping (domain → IP)","source":"§3 — DNS records table","flag":false},{"id":49,"topic":"Reconnaissance","bonus":false,"q":"In Google hacking, which advanced operator restricts results to pages containing a term in the URL?","options":[{"letter":"A","text":"`intext:`"},{"letter":"B","text":"`allintitle:`"},{"letter":"C","text":"`inurl:`"},{"letter":"D","text":"`related:`"}],"answer":"C","rationale":"`inurl:` restricts results to pages with the term in the URL","source":"§3 — Advanced operators table","flag":false},{"id":50,"topic":"Scanning & Enumeration","bonus":false,"q":"In the lecturer's house analogy, what does scanning reveal?","options":[{"letter":"A","text":"Which house to rob"},{"letter":"B","text":"What the house exterior looks like"},{"letter":"C","text":"Which doors and windows are open or closed"},{"letter":"D","text":"Who lives in the house"}],"answer":"C","rationale":"Scanning = \"which doors and windows are open or closed?\"","source":"§4 — Three-way analogy; §8 trap","flag":false},{"id":51,"topic":"Scanning & Enumeration","bonus":false,"q":"During a TCP sweep, the attacker sends a SYN packet and receives RST ACK. What does this indicate?","options":[{"letter":"A","text":"The port is open"},{"letter":"B","text":"The port is closed"},{"letter":"C","text":"The port is filtered"},{"letter":"D","text":"The host is unreachable"}],"answer":"B","rationale":"SYN → RST ACK = port closed (SYN ACK = open, no response = filtered)","source":"§4 — TCP sweeps","flag":false},{"id":52,"topic":"Scanning & Enumeration","bonus":false,"q":"A decoy scan (`nmap -D`) requires which condition to be effective?","options":[{"letter":"A","text":"All decoy addresses must be real machines"},{"letter":"B","text":"At least one of the addresses must be the attacker's real address"},{"letter":"C","text":"The target must not be behind a firewall"},{"letter":"D","text":"All decoys must be offline"}],"answer":"B","rationale":"One decoy address must be real or the target's responses won't be received","source":"§4 — Decoy scan","flag":false},{"id":53,"topic":"Scanning & Enumeration","bonus":false,"q":"In `tracert` output, what do columns 2–4 represent?","options":[{"letter":"A","text":"Hop numbers for three different routes"},{"letter":"B","text":"Round-trip time for the 1st, 2nd, and 3rd probe packets"},{"letter":"C","text":"Source IP, destination IP, and gateway IP"},{"letter":"D","text":"TTL values for three retries"}],"answer":"B","rationale":"Col 1 = hop number; cols 2–4 = RTT for 1st/2nd/3rd probe packets; col 5 = host/router","source":"§4 — tracert output","flag":false},{"id":54,"topic":"Scanning & Enumeration","bonus":false,"q":"An \"intense scan\" in nmap uses which flag combination?","options":[{"letter":"A","text":"`-sS -sU -v`"},{"letter":"B","text":"`-T4 -A -v`"},{"letter":"C","text":"`-sV -O -n`"},{"letter":"D","text":"`-sn -PE -PP`"}],"answer":"B","rationale":"Intense scan = `nmap -T4 -A -v` (aggressive timing + OS/version/scripts/traceroute + verbose)","source":"§4 — Intense scan","flag":false},{"id":55,"topic":"Scanning & Enumeration","bonus":false,"q":"Per the brief, which RFC covers the TCP specification defining how open, closed, and filtered ports must respond?","options":[{"letter":"A","text":"RFC 768"},{"letter":"B","text":"RFC 792"},{"letter":"C","text":"RFC 793"},{"letter":"D","text":"RFC 1122"}],"answer":"C","rationale":"RFC 793 = TCP spec (open→ACK, closed→RST, filtered→ignore)","source":"§4 — RFC table; §7","flag":false},{"id":56,"topic":"Gain Access / System Hacking","bonus":false,"q":"In the attack surface measurement model, what does a Method's damage potential depend on?","options":[{"letter":"A","text":"The method's protocol"},{"letter":"B","text":"The method's privilege"},{"letter":"C","text":"The persistent data type"},{"letter":"D","text":"The number of open channels"}],"answer":"B","rationale":"Method damage potential = the method's privilege (channel = protocol; data item = persistent type)","source":"§5 — Damage potential table; §8 trap","flag":false},{"id":57,"topic":"Gain Access / System Hacking","bonus":false,"q":"In the IMAP server worked example, Courier: `<417.67, 2.25, 72.13>` vs Cyrus: `<343.00, 3.25, 66.5>`. If the main concern is privilege escalation on the host, which server should you choose and why?","options":[{"letter":"A","text":"Courier, because it has fewer channels"},{"letter":"B","text":"Cyrus, because it has a smaller methods DER"},{"letter":"C","text":"Courier, because it has more data items"},{"letter":"D","text":"Cyrus, because it has fewer data items"}],"answer":"B","rationale":"Cyrus methods DER 343.00 < Courier 417.67; methods dimension dominates for privilege escalation concerns","source":"§5 — IMAP worked example","flag":false},{"id":58,"topic":"Gain Access / System Hacking","bonus":false,"q":"In the password system described in the brief, what is compared at login?","options":[{"letter":"A","text":"The plaintext password with the stored plaintext"},{"letter":"B","text":"The hashed password with the stored hash"},{"letter":"C","text":"The salt with the hash"},{"letter":"D","text":"The username with the password"}],"answer":"B","rationale":"The hashed password is compared with the stored hash (salt added before hashing)","source":"§5 — Password system flow","flag":false},{"id":59,"topic":"Gain Access / System Hacking","bonus":false,"q":"THC Hydra is best described as:","options":[{"letter":"A","text":"A rainbow-table-based password cracker"},{"letter":"B","text":"A parallelised network login cracker that performs brute-force attacks to guess username/password combinations"},{"letter":"C","text":"A Windows security auditing tool"},{"letter":"D","text":"A hash lookup tool similar to Ophcrack"}],"answer":"B","rationale":"THC Hydra = parallelised network login cracker, brute-force username/password combos, non-hashed","source":"§5 — THC Hydra","flag":false},{"id":60,"topic":"Sniffing (bonus)","bonus":true,"q":"Why is ARP vulnerable to spoofing?","options":[{"letter":"A","text":"ARP uses weak encryption"},{"letter":"B","text":"ARP is a stateless protocol with no authentication — requests and replies can be forged"},{"letter":"C","text":"ARP runs on TCP port 80"},{"letter":"D","text":"ARP cache entries are permanent"}],"answer":"B","rationale":"ARP is stateless and unauthenticated — requests/replies can be forged","source":"§6 — ARP weakness; §8 trap","flag":false}]},{"id":"inf2001","label":"INF2001 Quiz 1","short":"INF2001","sub":"Intro to Software Engineering &middot; Weeks 1&ndash;5","questions":[{"id":1,"topic":"Software Engineering Fundamentals","bonus":false,"q":"Which statement best distinguishes software engineering from coding alone?","options":[{"letter":"A","text":"It concentrates exclusively on translating completed designs into source code."},{"letter":"B","text":"It replaces design and testing with repeatable programming conventions."},{"letter":"C","text":"It applies disciplined and measurable practices across the software life cycle, covering both product and process."},{"letter":"D","text":"It treats maintenance as separate from the development discipline."}],"answer":"C","rationale":"Software engineering spans disciplined, measurable product and process work rather than coding alone. Tags: W1–2, fundamentals, discrimination.","source":"brief 2","flag":false},{"id":2,"topic":"Software Engineering Fundamentals","bonus":false,"q":"What is the correct order of the classical software-development phases?","options":[{"letter":"A","text":"Requirements → Design → Analysis → Implementation and testing → Retirement → Maintenance"},{"letter":"B","text":"Analysis → Requirements → Design → Implementation and testing → Maintenance → Retirement"},{"letter":"C","text":"Requirements → Analysis → Implementation and testing → Design → Post-delivery maintenance → Retirement"},{"letter":"D","text":"Requirements → Analysis → Design → Implementation and testing → Post-delivery maintenance → Retirement"}],"answer":"D","rationale":"The classical order moves from requirements and analysis through design, implementation/testing, maintenance and retirement. Tags: W1–2, phases, recall.","source":"brief 2","flag":false},{"id":3,"topic":"Software Engineering Fundamentals","bonus":false,"q":"In the classical phases, which distinction separates analysis from design?","options":[{"letter":"A","text":"Analysis determines how the product will work; design records what users requested."},{"letter":"B","text":"Analysis handles coding; design handles integration and acceptance testing."},{"letter":"C","text":"Analysis determines what the product should do; design determines how it will do it."},{"letter":"D","text":"Analysis handles deployment; design handles post-delivery changes."}],"answer":"C","rationale":"Analysis specifies what the product should do, whereas design specifies how it will do it. Tags: W1–2, phases, discrimination.","source":"brief 2","flag":false},{"id":4,"topic":"Software Engineering Fundamentals","bonus":false,"q":"Approximately how is post-delivery maintenance divided among the three maintenance types?","options":[{"letter":"A","text":"Corrective 60%, perfective 20%, adaptive 20%"},{"letter":"B","text":"Corrective 20%, perfective 20%, adaptive 60%"},{"letter":"C","text":"Corrective 20%, perfective 60%, adaptive 20%"},{"letter":"D","text":"Corrective 33%, perfective 34%, adaptive 33%"}],"answer":"C","rationale":"Perfective maintenance is the largest category at about 60%; corrective and adaptive are about 20% each. Tags: W1–2, maintenance, recall.","source":"brief 2","flag":false},{"id":5,"topic":"Software Engineering Fundamentals","bonus":false,"q":"Which sequence gives the approximate relative cost of detecting and correcting a fault from requirements through post-delivery maintenance?","options":[{"letter":"A","text":"1, 4, 3, 52, 368"},{"letter":"B","text":"1, 3, 52, 4, 368"},{"letter":"C","text":"1, 3, 4, 52, 368"},{"letter":"D","text":"1, 3, 4, 368, 52"}],"answer":"C","rationale":"Fault-correction cost rises from 1 to 3, 4, 52 and finally 368 as discovery moves later. Tags: W1–2, fault cost, recall.","source":"brief 2","flag":false},{"id":6,"topic":"Software Engineering Fundamentals","bonus":false,"q":"Which cost-reduction claim matches the lecture's software-life-cycle estimates?","options":[{"letter":"A","text":"A 10% maintenance-cost reduction lowers total cost by about 6–7%."},{"letter":"B","text":"A 10% coding-cost reduction lowers total cost by 6–7%."},{"letter":"C","text":"A 10% maintenance-cost reduction lowers total cost by at most 2%."},{"letter":"D","text":"A 10% coding-cost reduction and a 10% maintenance-cost reduction have equal effects."}],"answer":"A","rationale":"Maintenance has greater cost leverage: a 10% reduction saves about 6–7%, versus at most 2% for coding. Tags: W1–2, cost leverage, discrimination.","source":"brief 2","flag":false},{"id":7,"topic":"Software Development Life-Cycle Models","bonus":false,"q":"Which combination most clearly identifies the Waterfall model?","options":[{"letter":"A","text":"Short increments, self-management and fixed timeboxes"},{"letter":"B","text":"Risk analysis in every iteration and a radius representing accumulated cost"},{"letter":"C","text":"Sequential phases, extensive documentation and substantial design before implementation"},{"letter":"D","text":"Use-case-centred phases adapted separately for each product"}],"answer":"C","rationale":"Waterfall is sequential, document-driven and associated with big design up front. Tags: W1–2, Waterfall, discrimination.","source":"brief 3.1","flag":false},{"id":8,"topic":"Software Development Life-Cycle Models","bonus":false,"q":"What do Waterfall and the rapid-prototyping variation have in common?","options":[{"letter":"A","text":"Both convert the prototype directly into the production system."},{"letter":"B","text":"Both deliver the finished software only once, at the end."},{"letter":"C","text":"Both require risk analysis during every iteration."},{"letter":"D","text":"Both deliver valuable increments every one to four weeks."}],"answer":"B","rationale":"Rapid prototyping accepts early change, but like Waterfall it still delivers the finished product once at the end. Tags: W1–2, prototyping, discrimination.","source":"brief 3.2","flag":false},{"id":9,"topic":"Software Development Life-Cycle Models","bonus":false,"q":"In the rapid-prototyping variation, which phase may be replaced by prototyping?","options":[{"letter":"A","text":"Design"},{"letter":"B","text":"Specification"},{"letter":"C","text":"Implementation"},{"letter":"D","text":"Post-delivery maintenance"}],"answer":"B","rationale":"Rapid prototyping may replace specification, but the module explicitly preserves the design phase. Tags: W1–2, prototyping, recall.","source":"brief 3.2","flag":false},{"id":10,"topic":"Software Development Life-Cycle Models","bonus":false,"q":"Which feature most strongly separates Spiral from Waterfall?","options":[{"letter":"A","text":"Spiral prohibits revisiting earlier work once a phase is complete."},{"letter":"B","text":"Spiral incorporates risk analysis into every iteration."},{"letter":"C","text":"Spiral removes customer participation after requirements are approved."},{"letter":"D","text":"Spiral uses one final delivery without intermediate prototypes."}],"answer":"B","rationale":"Spiral's defining distinction is risk analysis in every iteration. Tags: W1–2, Spiral, discrimination.","source":"brief 3.3","flag":false},{"id":11,"topic":"Software Development Life-Cycle Models","bonus":false,"q":"In RUP, which phase normally emphasises implementation, testing and operational releases and is usually the longest?","options":[{"letter":"A","text":"Inception"},{"letter":"B","text":"Construction"},{"letter":"C","text":"Elaboration"},{"letter":"D","text":"Transition"}],"answer":"B","rationale":"Construction concentrates on implementation and testing and normally lasts longer than the other RUP phases. Tags: W1–2, RUP, recall.","source":"brief 3.4","flag":false},{"id":12,"topic":"Software Development Life-Cycle Models","bonus":false,"q":"An agile team cannot complete every requested feature within its current timebox. What response matches the module's agile framing?","options":[{"letter":"A","text":"Extend the timebox until every planned feature is delivered."},{"letter":"B","text":"Freeze both the deadline and feature list, then add developers."},{"letter":"C","text":"Stop the iteration and return to a complete up-front specification."},{"letter":"D","text":"Retain the deadline and reduce the features included."}],"answer":"D","rationale":"Agile fixes the timebox rather than the feature set, so excess work is descoped. Tags: W1–2, Agile, application.","source":"brief 3.5","flag":false},{"id":13,"topic":"Requirements Engineering","bonus":false,"q":"Which sequence lists the four requirements-engineering activities in the order presented?","options":[{"letter":"A","text":"Elicitation → Analysis → Validation → Management"},{"letter":"B","text":"Elicitation → Validation → Analysis → Management"},{"letter":"C","text":"Analysis → Elicitation → Management → Validation"},{"letter":"D","text":"Elicitation → Management → Analysis → Validation"}],"answer":"A","rationale":"The four activities are elicitation, analysis, validation and management. Tags: W2, RE process, recall.","source":"brief 4.2","flag":false},{"id":14,"topic":"Requirements Engineering","bonus":false,"q":"Which description best captures requirements elicitation rather than simple requirements gathering?","options":[{"letter":"A","text":"Recording every requested feature without challenging whether it is needed"},{"letter":"B","text":"Converting approved requirements directly into implementation technologies"},{"letter":"C","text":"Checking completed requirements only for consistency and testability"},{"letter":"D","text":"Actively discovering stakeholder needs while focusing on the problem rather than a technical solution"}],"answer":"D","rationale":"Elicitation actively uncovers needs and concentrates on the problem, unlike merely recording wants. Tags: W2, elicitation, discrimination.","source":"brief 4.3","flag":false},{"id":15,"topic":"Requirements Engineering","bonus":false,"q":"Which stakeholder is classified as external in the module's stakeholder categories?","options":[{"letter":"A","text":"A regulator imposing compliance obligations"},{"letter":"B","text":"A developer implementing the system"},{"letter":"C","text":"A quality-assurance employee"},{"letter":"D","text":"A system administrator operating the product"}],"answer":"A","rationale":"Regulators are external stakeholders; developers and QA are internal, while administrators are primary stakeholders. Tags: W2, stakeholders, discrimination.","source":"brief 4.2","flag":false},{"id":16,"topic":"Requirements Engineering","bonus":false,"q":"Which elicitation method is specifically designed to expose consensus, conflicting priorities and shared views through simultaneous group interaction?","options":[{"letter":"A","text":"Individual interview"},{"letter":"B","text":"Document analysis"},{"letter":"C","text":"Shadowing"},{"letter":"D","text":"Focus group"}],"answer":"D","rationale":"Focus groups use group interaction to reveal consensus, conflict and priorities. Tags: W2, elicitation methods, discrimination.","source":"brief 4.3","flag":false},{"id":17,"topic":"Requirements Engineering","bonus":false,"q":"An analyst follows an employee throughout an entire working day to understand the employee's workflow. Which observation type is being used?","options":[{"letter":"A","text":"Shadowing"},{"letter":"B","text":"Passive observation"},{"letter":"C","text":"Active observation"},{"letter":"D","text":"Prototyping"}],"answer":"A","rationale":"Shadowing means following a user through the complete working day rather than silently watching one task. Tags: W2, observation, application.","source":"brief 4.3","flag":false},{"id":18,"topic":"Requirements Engineering","bonus":false,"q":"Which limitation is particularly associated with questionnaires rather than interviews?","options":[{"letter":"A","text":"They cannot collect quantitative ratings from large groups."},{"letter":"B","text":"They always reveal more contextual detail than interviews."},{"letter":"C","text":"They cannot provide immediate clarification when an answer is ambiguous."},{"letter":"D","text":"They require respondents to interact as a group."}],"answer":"C","rationale":"Questionnaires offer broad reach but, unlike interviews, provide no immediate opportunity to clarify an answer. Tags: W2, questionnaires, discrimination.","source":"brief 4.3","flag":false},{"id":19,"topic":"Requirements Engineering","bonus":false,"q":"Which statement correctly distinguishes functional from non-functional requirements?","options":[{"letter":"A","text":"Functional requirements describe quality levels; non-functional requirements describe user tasks."},{"letter":"B","text":"Functional requirements are always high-level; non-functional requirements are always detailed."},{"letter":"C","text":"Functional requirements specify what the system does; non-functional requirements specify qualities and constraints."},{"letter":"D","text":"Functional requirements come from users; non-functional requirements come only from regulators."}],"answer":"C","rationale":"Functional requirements state what the system does; non-functional requirements state qualities and constraints. Tags: W2, requirement types, discrimination.","source":"brief 4.5","flag":false},{"id":20,"topic":"Requirements Engineering","bonus":false,"q":"A requirement states that a system must comply with a statute governing personal-data protection. Which non-functional category does it belong to?","options":[{"letter":"A","text":"Product"},{"letter":"B","text":"Organisational"},{"letter":"C","text":"External"},{"letter":"D","text":"Functional system"}],"answer":"C","rationale":"Statutory and regulatory constraints arise outside the system and are external requirements. Tags: W2, NFR categories, application.","source":"brief 4.5","flag":false},{"id":21,"topic":"Requirements Engineering","bonus":false,"q":"Which requirement is measurable rather than vague?","options":[{"letter":"A","text":"Experienced users shall average no more than two errors per hour after four hours of training."},{"letter":"B","text":"The interface shall be intuitive for all employees."},{"letter":"C","text":"The system shall respond quickly during normal use."},{"letter":"D","text":"The application shall provide excellent reliability."}],"answer":"A","rationale":"Training hours and errors per hour provide testable quantities, unlike subjective terms such as intuitive or excellent. Tags: W2, measurable NFR, discrimination.","source":"brief 4.5","flag":false},{"id":22,"topic":"Requirements Engineering","bonus":false,"q":"A requirement deliberately avoids prescribing a database, programming language or platform. Which quality does this demonstrate?","options":[{"letter":"A","text":"Implementation free"},{"letter":"B","text":"Traceable"},{"letter":"C","text":"Modifiable"},{"letter":"D","text":"Prioritised"}],"answer":"A","rationale":"An implementation-free requirement leaves technology choices to the developer. Tags: W2, requirement quality, application.","source":"brief 4.6","flag":false},{"id":23,"topic":"Requirements Engineering","bonus":false,"q":"Which specification format is based on mathematical concepts and reduces ambiguity, but may be difficult for customers to understand or accept as a contract?","options":[{"letter":"A","text":"Natural language"},{"letter":"B","text":"Structured natural language"},{"letter":"C","text":"Graphical notation"},{"letter":"D","text":"Formal specification"}],"answer":"D","rationale":"Formal specification uses mathematical notation to reduce ambiguity but requires expertise and may alienate customers. Tags: W2, specification formats, discrimination.","source":"brief 4.7","flag":false},{"id":24,"topic":"Requirements Engineering","bonus":false,"q":"During validation, which check asks whether a requirement can be implemented with the available budget and technology?","options":[{"letter":"A","text":"Validity"},{"letter":"B","text":"Consistency"},{"letter":"C","text":"Realism"},{"letter":"D","text":"Verifiability"}],"answer":"C","rationale":"Realism checks whether implementation is feasible under available technology and budget. Tags: W2, validation, discrimination.","source":"brief 4.4","flag":false},{"id":25,"topic":"Use Case Modelling","bonus":false,"q":"Which actor name follows the recommended use-case naming convention?","options":[{"letter":"A","text":"Amelia Tan"},{"letter":"B","text":"Person"},{"letter":"C","text":"User Number 1042"},{"letter":"D","text":"Library Member"}],"answer":"D","rationale":"Actors are named by roles such as Library Member, not personal names or generic labels. Tags: W3, actors, application.","source":"brief 5.1","flag":false},{"id":26,"topic":"Use Case Modelling","bonus":false,"q":"What distinguishes a supporting actor from a primary actor?","options":[{"letter":"A","text":"A supporting actor begins the interaction to achieve the principal goal."},{"letter":"B","text":"A supporting actor performs a sub-goal that assists the use case."},{"letter":"C","text":"A supporting actor must be a non-human external system."},{"letter":"D","text":"A supporting actor is located inside the software boundary."}],"answer":"B","rationale":"A supporting actor assists by carrying out a sub-goal, while the primary actor initiates the principal goal. Tags: W3, actors, discrimination.","source":"brief 5.1","flag":false},{"id":27,"topic":"Use Case Modelling","bonus":false,"q":"Which item is suitable as a use case?","options":[{"letter":"A","text":"Maintain 99.8% website availability"},{"letter":"B","text":"Support no more than 200 simultaneous users"},{"letter":"C","text":"Submit a subscription renewal"},{"letter":"D","text":"Complete database requests within two seconds"}],"answer":"C","rationale":"Submitting a renewal is a user goal; availability, capacity and response time are non-functional constraints. Tags: W3, use cases, discrimination.","source":"brief 5.1","flag":false},{"id":28,"topic":"Use Case Modelling","bonus":false,"q":"An authentication use case must run whenever either “Transfer Funds” or “View Statement” executes. Which relationship should connect each base use case to authentication?","options":[{"letter":"A","text":"`<<extend>>`"},{"letter":"B","text":"Actor association"},{"letter":"C","text":"Generalisation"},{"letter":"D","text":"`<<include>>`"}],"answer":"D","rationale":"`<<include>>` is mandatory and supports reusable behaviour required by multiple base use cases. Tags: W3, include, application.","source":"brief 5.3","flag":false},{"id":29,"topic":"Use Case Modelling","bonus":false,"q":"A fraud-warning behaviour is inserted into an identity-check use case only when suspicious data is detected. Which relationship describes this behaviour?","options":[{"letter":"A","text":"`<<include>>`, because the warning always executes"},{"letter":"B","text":"Association, because both behaviours share an actor"},{"letter":"C","text":"Generalisation, because one behaviour inherits the other"},{"letter":"D","text":"`<<extend>>`, because the warning is conditional"}],"answer":"D","rationale":"`<<extend>>` inserts optional behaviour only when its stated condition holds. Tags: W3, extend, application.","source":"brief 5.3","flag":false},{"id":30,"topic":"Use Case Modelling","bonus":false,"q":"In a use case description, where should a failed payment and its resulting recovery steps normally be recorded?","options":[{"letter":"A","text":"Preconditions"},{"letter":"B","text":"Alternative scenarios"},{"letter":"C","text":"Main success scenario"},{"letter":"D","text":"Primary actor"}],"answer":"B","rationale":"Alternative scenarios contain exceptions and non-success paths such as payment failure and recovery. Tags: W3, use-case descriptions, application.","source":"brief 5.4","flag":false},{"id":31,"topic":"Activity Diagrams","bonus":false,"q":"Which activity-diagram notation pairing is correct?","options":[{"letter":"A","text":"Start node = filled circle; end node = bullseye"},{"letter":"B","text":"Start node = bullseye; end node = filled circle"},{"letter":"C","text":"Start node = diamond; end node = rounded rectangle"},{"letter":"D","text":"Start node = thick bar; end node = diamond"}],"answer":"A","rationale":"The initial node is filled, while the final node is a bullseye. Tags: W3, activity notation, recall.","source":"brief 6","flag":false},{"id":32,"topic":"Activity Diagrams","bonus":false,"q":"A workflow sends an email and updates an audit log at the same time. Which element should split the flow?","options":[{"letter":"A","text":"Decision"},{"letter":"B","text":"Merge"},{"letter":"C","text":"Join"},{"letter":"D","text":"Fork"}],"answer":"D","rationale":"A fork splits one flow into activities that proceed in parallel; a decision selects among conditions. Tags: W3, fork, application.","source":"brief 6","flag":false},{"id":33,"topic":"Activity Diagrams","bonus":false,"q":"Which statement correctly distinguishes a join from a merge?","options":[{"letter":"A","text":"A join selects a conditional path; a merge starts parallel work."},{"letter":"B","text":"A join reunites conditional alternatives; a merge synchronises parallel paths."},{"letter":"C","text":"A join and a merge are interchangeable names for a thick bar."},{"letter":"D","text":"A join synchronises parallel paths; a merge reunites conditional alternatives."}],"answer":"D","rationale":"A join synchronises parallel work, whereas a merge reunites alternatives created by a decision. Tags: W3, join and merge, discrimination.","source":"brief 6","flag":false},{"id":34,"topic":"Activity Diagrams","bonus":false,"q":"What should appear on the outgoing arrows from an activity-diagram decision node?","options":[{"letter":"A","text":"Identical event triggers without guard conditions"},{"letter":"B","text":"Method return types and parameter lists"},{"letter":"C","text":"Participant names and message arguments"},{"letter":"D","text":"Distinct guard conditions without event triggers"}],"answer":"D","rationale":"Decision outputs carry distinct guard conditions and do not use event triggers. Tags: W3, decisions, recall.","source":"brief 6","flag":false},{"id":35,"topic":"Activity Diagrams","bonus":false,"q":"What information is primarily communicated by swimlanes?","options":[{"letter":"A","text":"The order in which objects are created"},{"letter":"B","text":"The party responsible for each activity"},{"letter":"C","text":"The attributes inherited by each class"},{"letter":"D","text":"The optional behaviour extending a use case"}],"answer":"B","rationale":"Swimlanes allocate workflow activities to responsible actors or systems. Tags: W3, swimlanes, discrimination.","source":"brief 6","flag":false},{"id":36,"topic":"Activity Diagrams","bonus":false,"q":"Which modelling need exposes a limitation of activity diagrams and points toward using a sequence diagram?","options":[{"letter":"A","text":"Showing conditional branches in a workflow"},{"letter":"B","text":"Showing which objects exchange messages over time"},{"letter":"C","text":"Showing parallel work and its synchronisation"},{"letter":"D","text":"Showing which party performs an activity through partitions"}],"answer":"B","rationale":"Activity diagrams show workflow but not object-to-object messaging over time, which is the sequence-diagram view. Tags: W3, diagram choice, application.","source":"brief 6","flag":false},{"id":37,"topic":"Object-Oriented Principles and Class Diagrams","bonus":false,"q":"Which UML visibility mapping is correct?","options":[{"letter":"A","text":"`+` private, `−` protected, `#` public"},{"letter":"B","text":"`+` protected, `−` public, `#` private"},{"letter":"C","text":"`+` public, `−` protected, `#` private"},{"letter":"D","text":"`+` public, `−` private, `#` protected"}],"answer":"D","rationale":"UML uses `+` for public, `−` for private and `#` for protected visibility. Tags: W4, visibility, recall.","source":"brief 7.2","flag":false},{"id":38,"topic":"Object-Oriented Principles and Class Diagrams","bonus":false,"q":"Which statement correctly distinguishes a class from an object?","options":[{"letter":"A","text":"A class is an instance with values; an object is the reusable template."},{"letter":"B","text":"A class defines attributes and operations; an object is an instance of that class."},{"letter":"C","text":"A class contains only operations; an object contains only data."},{"letter":"D","text":"A class represents behaviour; an object represents inheritance."}],"answer":"B","rationale":"A class is the template defining data and operations; an object is one instance of it. Tags: W4, class and object, discrimination.","source":"brief 7.2","flag":false},{"id":39,"topic":"Object-Oriented Principles and Class Diagrams","bonus":false,"q":"Which symbol represents inheritance in a UML class diagram?","options":[{"letter":"A","text":"A solid line with a hollow triangular arrowhead"},{"letter":"B","text":"A dashed line with a hollow triangular arrowhead"},{"letter":"C","text":"A dashed line with an open arrowhead"},{"letter":"D","text":"A solid line ending in a filled diamond"}],"answer":"A","rationale":"Inheritance uses a solid line and hollow triangle; realization uses the same triangle with a dashed line. Tags: W4, relationships, discrimination.","source":"brief 7.5","flag":false},{"id":40,"topic":"Object-Oriented Principles and Class Diagrams","bonus":false,"q":"Which feature distinguishes composition from aggregation?","options":[{"letter":"A","text":"Composition uses a dashed line rather than a solid line."},{"letter":"B","text":"Composition places a filled diamond at the whole end."},{"letter":"C","text":"Composition uses an open arrowhead rather than a triangle."},{"letter":"D","text":"Composition places a hollow diamond at the part end."}],"answer":"B","rationale":"Composition is the stronger whole–part relationship and uses a filled diamond at the whole end. Tags: W4, relationships, discrimination.","source":"brief 7.5","flag":false},{"id":41,"topic":"Object-Oriented Principles and Class Diagrams","bonus":false,"q":"Which statement best describes information hiding?","options":[{"letter":"A","text":"Data and functions are grouped into a single component."},{"letter":"B","text":"Internal state is accessed through operations rather than directly by external clients."},{"letter":"C","text":"A subclass receives the properties and behaviours of its superclass."},{"letter":"D","text":"Different objects respond differently to the same message."}],"answer":"B","rationale":"Information hiding prevents direct external access to state and mediates access through operations. Tags: W4, information hiding, discrimination.","source":"brief 7.3","flag":false},{"id":42,"topic":"Object-Oriented Principles and Class Diagrams","bonus":false,"q":"Several subclasses each implement `render()` differently, while client code sends the same `render()` message without checking the object's subtype. Which principle is illustrated?","options":[{"letter":"A","text":"Polymorphism"},{"letter":"B","text":"Encapsulation"},{"letter":"C","text":"Information hiding"},{"letter":"D","text":"Inheritance"}],"answer":"A","rationale":"Polymorphism lets different implementations handle the same message transparently to client code. Tags: W4, polymorphism, application.","source":"brief 7.3","flag":false},{"id":43,"topic":"Sequence Diagrams","bonus":false,"q":"How are the axes interpreted in a sequence diagram?","options":[{"letter":"A","text":"Horizontal shows participants; vertical time advances downward."},{"letter":"B","text":"Horizontal shows time; vertical shows participants."},{"letter":"C","text":"Horizontal shows class inheritance; vertical shows object ownership."},{"letter":"D","text":"Horizontal shows activities; vertical time advances upward."}],"answer":"A","rationale":"Participants are arranged horizontally, while time advances downward on the vertical axis. Tags: W4, sequence axes, recall.","source":"brief 8","flag":false},{"id":44,"topic":"Sequence Diagrams","bonus":false,"q":"Which statement correctly distinguishes a lifeline from an activation?","options":[{"letter":"A","text":"A lifeline is a dashed vertical line; an activation is a thick box placed over it."},{"letter":"B","text":"A lifeline is a thick box; an activation is a dashed vertical line."},{"letter":"C","text":"A lifeline is a horizontal message; an activation is a dashed return."},{"letter":"D","text":"A lifeline is an `X`; an activation is an arrow labelled `new`."}],"answer":"A","rationale":"A lifeline is dashed and vertical; an activation is the thick execution box placed over it. Tags: W4, sequence notation, discrimination.","source":"brief 8","flag":false},{"id":45,"topic":"Sequence Diagrams","bonus":false,"q":"How is an object created during a sequence-diagram scenario represented?","options":[{"letter":"A","text":"By a dashed return arrow terminating in an `X`"},{"letter":"B","text":"By an `(opt)` frame around the object's lifeline"},{"letter":"C","text":"By an arrow labelled `new`, with the created object appearing lower than initial objects"},{"letter":"D","text":"By a filled diamond beside the object's name"}],"answer":"C","rationale":"Creation uses an arrow labelled `new`, and the new participant begins lower because it did not exist initially. Tags: W4, object lifetime, recall.","source":"brief 8","flag":false},{"id":46,"topic":"Sequence Diagrams","bonus":false,"q":"Which frame notation represents an if/else choice?","options":[{"letter":"A","text":"`(alt) [condition]`, divided by a horizontal dashed line"},{"letter":"B","text":"`(opt) [condition]`"},{"letter":"C","text":"`(loop) [condition]`"},{"letter":"D","text":"`ref`, containing the name of another diagram"}],"answer":"A","rationale":"An `(alt)` frame represents if/else alternatives separated by a horizontal dashed line. Tags: W4, frames, discrimination.","source":"brief 8","flag":false},{"id":47,"topic":"Sequence Diagrams","bonus":false,"q":"What distinguishes a return from a method-call message in a sequence diagram?","options":[{"letter":"A","text":"A return is shown as a dashed arrow back."},{"letter":"B","text":"A return is shown as a filled diamond."},{"letter":"C","text":"A return is shown as a thick vertical bar."},{"letter":"D","text":"A return is shown as an arrow labelled `new`."}],"answer":"A","rationale":"Method calls use message arrows, while a return is represented by a dashed arrow back. Tags: W4, messages, discrimination.","source":"brief 8","flag":false},{"id":48,"topic":"Sequence Diagrams","bonus":false,"q":"Which statement best describes the scope of a sequence diagram?","options":[{"letter":"A","text":"It models one scenario by showing participant interactions over time."},{"letter":"B","text":"It models all workflows and use cases in the complete system."},{"letter":"C","text":"It provides a static inventory of class attributes and operations."},{"letter":"D","text":"It decomposes project deliverables into lowest-level tasks."}],"answer":"A","rationale":"A sequence diagram follows the participant interactions of one scenario over time. Tags: W4, sequence purpose, discrimination.","source":"brief 8","flag":false},{"id":49,"topic":"Project Management and Estimation","bonus":false,"q":"Which description defines a Work Breakdown Structure?","options":[{"letter":"A","text":"A time-based chart showing start dates, due dates and completion percentages"},{"letter":"B","text":"A formula converting size estimates into person-hours"},{"letter":"C","text":"A deliverable-oriented hierarchy that decomposes project work"},{"letter":"D","text":"A model showing how estimation ranges narrow over time"}],"answer":"C","rationale":"A WBS hierarchically decomposes deliverable-oriented work; a Gantt chart supplies the scheduling view. Tags: W5, WBS, discrimination.","source":"brief 9.1","flag":false},{"id":50,"topic":"Project Management and Estimation","bonus":false,"q":"Which combination matches the general rule for a lowest-level WBS task?","options":[{"letter":"A","text":"One owner, 2–20 days, no more than one person-week of effort"},{"letter":"B","text":"Multiple owners, 1–4 weeks, no more than one person-month of effort"},{"letter":"C","text":"One owner, 2–20 weeks, no more than one person-month of effort"},{"letter":"D","text":"Multiple owners, 2–20 days, no effort ceiling"}],"answer":"A","rationale":"A lowest-level task should have exactly one owner, last 2–20 days and require no more than one person-week. Tags: W5, WBS, recall.","source":"brief 9.1","flag":false},{"id":51,"topic":"Project Management and Estimation","bonus":false,"q":"At the end of the analysis workflow, what likely actual-cost range is given for a $1 million estimate?","options":[{"letter":"A","text":"$0.25 million to $4 million"},{"letter":"B","text":"$0.5 million to $2 million"},{"letter":"C","text":"$0.92 million to $1.02 million"},{"letter":"D","text":"$0.67 million to $1.5 million"}],"answer":"D","rationale":"At the end of analysis, the $1M estimate narrows to $0.67M–$1.5M, the earliest appropriate detailed-estimation point. Tags: W5, Cone of Uncertainty, recall.","source":"brief 9.2","flag":false},{"id":52,"topic":"Project Management and Estimation","bonus":false,"q":"Which ordering correctly represents the estimation flow?","options":[{"letter":"A","text":"Effort → size → cost → duration"},{"letter":"B","text":"Size → effort → duration and cost"},{"letter":"C","text":"Duration → size → effort and cost"},{"letter":"D","text":"Cost → duration → size and effort"}],"answer":"B","rationale":"Size estimation feeds effort estimation, from which duration and cost are derived. Tags: W5, estimation structure, discrimination.","source":"brief 9.3","flag":false},{"id":53,"topic":"Project Management and Estimation","bonus":false,"q":"A system has two average external inputs, one complex external output, three simple external enquiries, one average internal logical file and two simple external interface files. What is its UFP?","options":[{"letter":"A","text":"40"},{"letter":"B","text":"42"},{"letter":"C","text":"44"},{"letter":"D","text":"46"}],"answer":"C","rationale":"The UFP is `2×4 + 1×7 + 3×3 + 1×10 + 2×5 = 44`. Tags: W5, Function Points, application.","source":"brief 9.4","flag"
